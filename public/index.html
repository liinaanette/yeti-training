<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yeti Alone-Time Training</title>
<meta name="theme-color" content="#2c55e0">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yeti">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one narrow phone column, today's plan as a ticket of reps, bottom tab bar. Snow-and-cobalt palette for a dog called Yeti. */
:root {
  --bg: #e9eef1;
  --surface: #ffffff;
  --surface-2: #f4f7f9;
  --line: #d4dde3;
  --ink: #15202a;
  --muted: #5b6b78;
  --accent: #2c55e0;
  --accent-ink: #ffffff;
  --accent-soft: #dfe6fc;
  --calm: #23845a;
  --calm-soft: #dcf1e6;
  --mild: #a8700a;
  --mild-soft: #f8ecd2;
  --upset: #c23c2c;
  --upset-soft: #f8dfdb;
  --overlay: #0f1922;
  --overlay-ink: #eef3f7;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f161c; --surface: #18222b; --surface-2: #1e2a34; --line: #2b3a46;
    --ink: #e7eef3; --muted: #93a4b1; --accent: #7d9bff; --accent-ink: #0d1530; --accent-soft: #233056;
    --calm: #5ccf97; --calm-soft: #17352a; --mild: #e8b44c; --mild-soft: #3a2f17;
    --upset: #ff8a7a; --upset-soft: #432420; --overlay: #070c10; --overlay-ink: #eef3f7;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f161c; --surface: #18222b; --surface-2: #1e2a34; --line: #2b3a46;
  --ink: #e7eef3; --muted: #93a4b1; --accent: #7d9bff; --accent-ink: #0d1530; --accent-soft: #233056;
  --calm: #5ccf97; --calm-soft: #17352a; --mild: #e8b44c; --mild-soft: #3a2f17;
  --upset: #ff8a7a; --upset-soft: #432420; --overlay: #070c10; --overlay-ink: #eef3f7;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  margin: 0;
  padding-block: calc(20px + env(safe-area-inset-top, 0px)) calc(96px + env(safe-area-inset-bottom, 0px));
}
.app { max-width: 560px; margin: 0 auto; display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
h2 { font-size: 1.15rem; font-weight: 700; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.notice { background: var(--mild-soft); color: var(--ink); border-radius: var(--r); padding: 10px 14px; font-size: 0.9rem; }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border-radius: var(--r); padding: 12px; display: grid; gap: 2px; min-width: 0; }
.stat b { font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat.lead { background: var(--accent); color: var(--accent-ink); }
.stat.lead .eyebrow { color: inherit; opacity: 0.85; }

.card { background: var(--surface); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
.why { font-size: 0.92rem; color: var(--muted); }

.cues { display: grid; gap: 8px; }
.check { display: flex; gap: 10px; align-items: center; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.cue-list { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 0.85rem; }

.reps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border-top: 1px dashed var(--line); }
.rep { display: grid; grid-template-columns: 2rem 1fr auto; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.rep .idx { font-family: var(--font-display); color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.rep .dur { font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.rep .sub { font-size: 0.82rem; color: var(--muted); }
.rep.next { background: var(--accent-soft); margin-inline: -16px; padding-inline: 16px; border-radius: 10px; border-bottom-color: transparent; }
.rep.top .dur::after { content: "longest"; font-family: var(--font-body); font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); margin-left: 8px; vertical-align: middle; }
.pill { border-radius: 999px; padding: 3px 10px; font-size: 0.8rem; font-weight: 700; white-space: nowrap; }
.pill.calm { background: var(--calm-soft); color: var(--calm); }
.pill.mild { background: var(--mild-soft); color: var(--mild); }
.pill.upset { background: var(--upset-soft); color: var(--upset); }
.pill.skip { background: var(--surface-2); color: var(--muted); }

.btn { border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 700; background: var(--accent); color: var(--accent-ink); }
.btn.sm { padding: 8px 14px; font-size: 0.9rem; }
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--line); }
.btn.quiet { background: var(--surface-2); color: var(--ink); }
.btn:disabled { opacity: 0.45; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.banner { border-radius: var(--r); padding: 14px 16px; display: grid; gap: 6px; }
.banner.upset { background: var(--upset-soft); }
.banner.calm { background: var(--calm-soft); }
.banner.rest { background: var(--accent-soft); }

textarea, input[type="text"], input[type="number"], select {
  width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
textarea { min-height: 72px; resize: vertical; }
label.field { display: grid; gap: 6px; font-weight: 700; font-size: 0.92rem; }
label.field span.muted { font-weight: 400; }

/* History */
.chart-wrap { overflow-x: auto; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.82rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.session { background: var(--surface); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 8px; }
.session-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.dots { display: flex; flex-wrap: wrap; gap: 4px; }
.dot { font-size: 0.75rem; border-radius: 6px; padding: 2px 6px; font-weight: 700; font-variant-numeric: tabular-nums; }
.dot.calm { background: var(--calm-soft); color: var(--calm); }
.dot.mild { background: var(--mild-soft); color: var(--mild); }
.dot.upset { background: var(--upset-soft); color: var(--upset); }
.dot.none { background: var(--surface-2); color: var(--muted); }
.who { display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--muted); }
.who img { width: 20px; height: 20px; border-radius: 50%; }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); }

/* Setup */
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
.presets button { border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 8px 12px; font-weight: 700; }
.presets button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

/* Tabs */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabs nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.tabs button { background: none; border: 0; padding: 14px 4px; font-weight: 700; color: var(--muted); border-top: 3px solid transparent; }
.tabs button[aria-current="page"] { color: var(--accent); border-top-color: var(--accent); }

/* Timer overlay */
.overlay {
  position: fixed; inset: 0; z-index: 20; background: var(--overlay); color: var(--overlay-ink);
  display: grid; align-content: center; justify-items: center; gap: 22px; text-align: center;
  padding: calc(24px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
}
.overlay .eyebrow { color: #9fb2c2; }
.ring { width: min(72vw, 300px); max-width: 100%; aspect-ratio: 1; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .clock { position: absolute; inset: 0; display: grid; place-content: center; gap: 4px; }
.ring .clock b { font-family: var(--font-display); font-size: clamp(2.6rem, 14vw, 4.2rem); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.overlay .btn.quiet { background: #223240; color: var(--overlay-ink); }
.outcome { width: min(100%, 420px); display: grid; gap: 10px; text-align: left; }
.outcome button.res { border: 2px solid transparent; border-radius: 14px; padding: 14px 16px; text-align: left; display: grid; gap: 2px; background: #1b2834; color: var(--overlay-ink); }
.outcome button.res b { font-family: var(--font-display); font-size: 1.15rem; }
.outcome button.res span { font-size: 0.85rem; color: #a9bac8; }
.outcome button.res.calm b { color: #5ccf97; }
.outcome button.res.mild b { color: #e8b44c; }
.outcome button.res.upset b { color: #ff8a7a; }
.outcome button.res[aria-pressed="true"] { border-color: currentColor; }
.outcome input { background: #1b2834; border-color: #2c3d4c; color: var(--overlay-ink); }
details summary { cursor: pointer; font-weight: 700; }
details[open] summary { margin-bottom: 8px; }
.prose { display: grid; gap: 8px; font-size: 0.93rem; }
.prose ul { margin: 0; padding-left: 1.2rem; display: grid; gap: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="card empty">Loading…</div>
</div>
<div class="tabs" id="tabs" hidden>
  <nav aria-label="Sections">
    <button data-tab="today" aria-current="page">Today</button>
    <button data-tab="history">History</button>
    <button data-tab="settings">Settings</button>
  </nav>
</div>
<div class="overlay" id="overlay" hidden></div>

<script>
(() => {
  const RESULTS = {
    calm: { label: "Calm", hint: "Relaxed, lying down, sniffing around, sleeping" },
    mild: { label: "Mild stress", hint: "Pacing, waiting at the door, a whine or two" },
    upset: { label: "Upset", hint: "Barking, howling, scratching, heavy panting" },
  };
  const CUES = ["Pick up keys", "Put on shoes", "Put on jacket", "Grab your bag", "Touch the door handle", "Open and close the front door", "Pick up phone and wallet"];
  // Up-and-down rep shapes (fractions of the working duration). The longest rep sits late, an easy rep closes the session.
  const PATTERNS = [
    [0.1, 0.3, 0.6, 0.2, 0.8, 0.45, 1, 0.25],
    [0.15, 0.5, 0.25, 0.7, 0.35, 0.9, 1, 0.2],
    [0.1, 0.4, 0.7, 0.3, 1, 0.5, 0.85, 0.15],
  ];
  const REST_BETWEEN = 90;

  const state = {
    tab: "today", config: null, configLoaded: false, sessions: new Map(),
    me: null, authChecked: false, offline: false, trainAnyway: false, ignoreUpset: false, timer: null, openHistory: new Set(),
  };

  // ---------- time helpers ----------
  const pad = n => String(n).padStart(2, "0");
  const dateStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayStr = () => dateStr(new Date());
  const dayNum = s => Math.round(Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 864e5);
  const daysBetween = (a, b) => dayNum(b) - dayNum(a);
  const addDays = (s, n) => { const d = new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10) + n); return dateStr(d); };
  const niceDate = (s, opts = { weekday: "long", day: "numeric", month: "long" }) =>
    new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)).toLocaleDateString(undefined, opts);

  function fmt(sec) {
    sec = Math.round(sec);
    if (sec < 60) return `${sec}s`;
    if (sec < 3600) { const m = Math.floor(sec / 60), r = sec % 60; return r ? `${m}m ${r}s` : `${m}m`; }
    const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
    return m ? `${h}h ${pad(m)}m` : `${h}h`;
  }
  const clock = sec => { sec = Math.max(0, Math.ceil(sec)); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`; };
  function parseDur(txt) {
    txt = String(txt).trim().toLowerCase();
    if (!txt) return null;
    if (/^\d+(:\d{1,2}){1,2}$/.test(txt)) return txt.split(":").map(Number).reduce((a, b) => a * 60 + b, 0);
    let total = 0, matched = false;
    txt.replace(/(\d+(?:\.\d+)?)\s*(h|m|min|s|sec)?/g, (_, n, u) => { matched = true; total += +n * (u === "h" ? 3600 : u && u.startsWith("m") ? 60 : u ? 1 : 1); });
    return matched && total > 0 ? Math.round(total) : null;
  }
  function roundDur(s) {
    const step = s < 20 ? 1 : s < 60 ? 5 : s < 600 ? 15 : 60;
    return Math.max(2, Math.round(s / step) * step);
  }
  function grow(w) {
    if (w < 60) return w + Math.max(5, w * 0.25);
    if (w < 600) return w * 1.15;
    if (w < 1800) return w * 1.1;
    return w * 1.07;
  }

  // ---------- the training logic ----------
  const dog = () => (state.config && state.config.dogName) || "Yeti";
  const doneReps = s => (s.reps || []).filter(r => r.result && r.result !== "skip");

  // What the next session's working (longest) duration should be after a given session.
  function nextAfter(s) {
    const prev = s.working;
    const done = doneReps(s);
    const upset = done.filter(r => r.result === "upset");
    const mild = done.filter(r => r.result === "mild");
    const calmTop = done.some(r => r.result === "calm" && r.target >= prev * 0.97);
    if (upset.length) {
      const t = Math.min(...upset.map(r => r.actual || r.target));
      return { w: Math.min(prev, t) * 0.6, why: `${dog()} got upset last session, so today steps back for an easy win.` };
    }
    if (mild.length) return { w: prev * 0.85, why: "Some mild stress last session, so today is a small step back." };
    if (calmTop) return { w: grow(prev), why: `${dog()} stayed calm through the longest rep last time, so today steps up.` };
    return { w: prev, why: "Last session didn't get through the longest rep, so today repeats the same level." };
  }

  function computeWorking() {
    const cfg = state.config, t = todayStr();
    const base = cfg.base || { seconds: 30, setOn: t };
    const past = [...state.sessions.values()]
      .filter(s => s.date < t && doneReps(s).length)
      .sort((a, b) => (a.date < b.date ? 1 : -1));
    const last = past[0];
    if (!last || base.setOn > last.date || (base.setOn === last.date && base.setAt > (last.createdAt || 0))) {
      return { w: roundDur(base.seconds), why: `Starting from the level you set: ${fmt(base.seconds)}.` };
    }
    let { w, why } = nextAfter(last);
    const gap = daysBetween(last.date, t);
    if (gap >= 4) { w *= 0.85; why += ` It's been ${gap} days, so it's a little easier.`; }
    return { w: roundDur(Math.max(3, w)), why };
  }

  function buildPlan(w, date) {
    const cap = ((state.config && state.config.capMin) || 30) * 60;
    const p = PATTERNS[((dayNum(date) % 3) + 3) % 3].slice();
    const total = arr => arr.reduce((a, f) => a + f * w, 0) + REST_BETWEEN * (arr.length - 1);
    while (total(p) > cap && p.length > 3) {
      let idx = -1, max = -1;
      p.forEach((f, i) => { if (f < 1 && i !== p.length - 1 && f > max) { max = f; idx = i; } });
      p.splice(idx, 1);
    }
    return p.map(f => roundDur(Math.max(2, f * w)));
  }
  const pickCues = date => { const n = dayNum(date); return [CUES[n % CUES.length], CUES[(n + 3) % CUES.length]]; };

  function restSuggested() {
    const t = todayStr(), per = (state.config && state.config.perWeek) || 5;
    let count = 0;
    for (let i = 1; i <= 6; i++) { const s = state.sessions.get(addDays(t, -i)); if (s && doneReps(s).length) count++; }
    return count >= per;
  }

  function weekCount() {
    const t = todayStr(); let c = 0;
    for (let i = 0; i < 7; i++) { const s = state.sessions.get(addDays(t, -i)); if (s && doneReps(s).length) c++; }
    return c;
  }
  function bestCalmEver() {
    let best = 0;
    for (const s of state.sessions.values()) for (const r of doneReps(s)) if (r.result === "calm") best = Math.max(best, r.actual || r.target);
    return best;
  }

  // ---------- storage ----------
  class AuthError extends Error {}
  async function api(path, opts = {}) {
    const res = await fetch(path, { ...opts, headers: { "Content-Type": "application/json" }, credentials: "same-origin" });
    const body = await res.json().catch(() => ({}));
    if (res.status === 401 && path !== "/api/login") {
      state.me = null; render();
      throw new AuthError("Not logged in");
    }
    if (!res.ok) throw new Error(body.error || `Request failed (${res.status})`);
    return body;
  }

  let pending = 0, lastSnapshot = "";
  const writeChains = new Map();
  function queueWrite(key, fn, onDone) {
    pending++;
    const next = (writeChains.get(key) || Promise.resolve())
      .then(fn)
      .then(result => { if (onDone && writeChains.get(key) === next) onDone(result); })
      .catch(e => { console.error(e); toast(e instanceof AuthError ? "You were logged out. Log in again." : "Couldn't save just now. Check your connection and try again."); })
      .finally(() => { pending--; });
    writeChains.set(key, next);
    return next;
  }

  // Pull everything from the server. Skipped while a save is in flight so it can't undo it.
  async function load() {
    if (pending || state.timer) return;
    try {
      const data = await api("/api/state");
      state.offline = false;
      const snapshot = JSON.stringify(data);
      if (pending || (snapshot === lastSnapshot && state.configLoaded)) return;
      lastSnapshot = snapshot;
      state.config = data.config;
      state.sessions = new Map(data.sessions.map(x => [x.date, x]));
      state.configLoaded = true;
      render();
    } catch (e) {
      if (!(e instanceof AuthError)) { state.offline = true; render(); }
    }
  }

  function saveSession(date, patch, create = false) {
    const existing = state.sessions.get(date);
    state.sessions.set(date, { ...(existing || {}), ...patch, date });
    render();
    return queueWrite("s:" + date, () => api(`/api/sessions/${date}`, { method: "PATCH", body: JSON.stringify({ patch, create }) }),
      r => { if (r && r.session) { state.sessions.set(date, r.session); render(); } });
  }
  function ensureToday() {
    const t = todayStr();
    if (state.sessions.get(t)) return state.sessions.get(t);
    const { w, why } = computeWorking();
    const s = { date: t, working: w, why, plan: buildPlan(w, t), cues: pickCues(t), cuesDone: false, reps: [], notes: "", createdAt: Date.now() };
    saveSession(t, s, true);
    return s;
  }
  function saveConfig(patch) {
    state.config = { ...(state.config || {}), ...patch };
    render();
    return queueWrite("config", () => api("/api/config", { method: "PUT", body: JSON.stringify({ data: state.config }) }));
  }

  // ---------- rendering ----------
  const appEl = document.getElementById("app");
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const personName = name => (name && name === state.me ? "You" : name || "Someone");

  let toastTimer;
  function toast(msg) {
    let el = document.getElementById("toast");
    if (!el) { el = document.createElement("div"); el.id = "toast"; el.className = "notice"; el.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;max-width:min(92vw,480px)"; document.body.appendChild(el); }
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.hidden = true), 4200);
  }

  function render() {
    if (!state.authChecked) return;
    if (!state.me) { document.getElementById("tabs").hidden = true; appEl.innerHTML = loginView(); return bindLogin(); }
    if (!state.configLoaded) {
      document.getElementById("tabs").hidden = true;
      appEl.innerHTML = state.offline ? `<div class="card empty">Can't reach the server. Check your connection; it retries on its own.</div>` : `<div class="card empty">Loading…</div>`;
      return;
    }
    const typing = document.activeElement && appEl.contains(document.activeElement) && document.activeElement.matches("input[type=text], input[type=number], input[type=password], textarea");
    if (typing) return; // don't clobber what someone is typing
    document.getElementById("tabs").hidden = !state.config;
    document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === state.tab ? "page" : "false"));
    if (!state.config) { appEl.innerHTML = setupView(); return bindSetup(); }
    const view = state.tab === "history" ? historyView() : state.tab === "settings" ? settingsView() : todayView();
    appEl.innerHTML = (state.offline ? `<div class="notice">Can't reach the server right now. Changes may not save until you're back online.</div>` : "") + view;
  }

  function loginView() {
    let lastName = "";
    try { lastName = localStorage.getItem("yeti-name") || ""; } catch (e) {}
    return `
      <div class="top"><div><p class="eyebrow">Separation training</p><h1>Log in</h1></div></div>
      <form class="card" id="login-form">
        <label class="field">Your name<span class="muted small">Shows in the history next to the reps you do.</span><input type="text" id="login-name" value="${esc(lastName)}" autocomplete="nickname" maxlength="40" required></label>
        <label class="field">Household password<input type="password" id="login-pass" autocomplete="current-password" required></label>
        <p class="small" id="login-err" style="color:var(--upset)" hidden></p>
        <button class="btn" type="submit">Log in</button>
      </form>`;
  }
  function bindLogin() {
    document.getElementById("login-form").onsubmit = async e => {
      e.preventDefault();
      const name = document.getElementById("login-name").value.trim();
      const password = document.getElementById("login-pass").value;
      const err = document.getElementById("login-err");
      try {
        const r = await api("/api/login", { method: "POST", body: JSON.stringify({ name, password }) });
        try { localStorage.setItem("yeti-name", r.name); } catch (e2) {}
        state.me = r.name; document.activeElement && document.activeElement.blur();
        render(); load();
      } catch (ex) { err.textContent = ex.message; err.hidden = false; }
    };
  }

  function setupView() {
    return `
      <div class="top"><div><p class="eyebrow">Separation training</p><h1>Let's set up the plan</h1></div></div>
      <div class="card">
        <label class="field">Dog's name<input type="text" id="setup-name" value="Yeti" autocomplete="off"></label>
        <div class="field" style="display:grid;gap:8px">
          <b class="small">How long can your dog stay alone right now and stay calm?</b>
          <p class="small muted">Pick the time you're confident about, not the best day ever. If you don't know, start short. The plan adjusts after every session.</p>
          <div class="presets" id="presets">
            ${[5, 15, 30, 60, 120, 300, 600].map(s => `<button type="button" data-s="${s}" aria-pressed="${s === 30}">${fmt(s)}</button>`).join("")}
          </div>
          <input type="text" id="setup-dur" placeholder="Or type a time, e.g. 1:30 or 4m" autocomplete="off">
        </div>
        <button class="btn" id="setup-go">Make today's plan</button>
      </div>`;
  }
  function bindSetup() {
    let chosen = 30;
    document.querySelectorAll("#presets button").forEach(b => (b.onclick = () => {
      chosen = +b.dataset.s; document.getElementById("setup-dur").value = "";
      document.querySelectorAll("#presets button").forEach(x => x.setAttribute("aria-pressed", x === b));
    }));
    document.getElementById("setup-go").onclick = () => {
      const typed = parseDur(document.getElementById("setup-dur").value);
      const seconds = typed || chosen;
      saveConfig({ dogName: document.getElementById("setup-name").value.trim() || "Yeti", base: { seconds, setOn: todayStr(), setAt: Date.now() }, perWeek: 5, capMin: 30 });
    };
  }

  function todayView() {
    const t = todayStr();
    const s = state.sessions.get(t);
    const computed = s ? null : computeWorking();
    const w = s ? s.working : computed.w;
    const plan = s ? s.plan : buildPlan(w, t);
    const cues = s ? s.cues : pickCues(t);
    const reps = (s && s.reps) || [];
    const repFor = i => reps.find(r => r.i === i);
    const nextIdx = plan.findIndex((_, i) => !repFor(i));
    const upset = reps.some(r => r.result === "upset");
    const allDone = nextIdx === -1;
    const estMin = Math.round((plan.reduce((a, b) => a + b, 0) + REST_BETWEEN * (plan.length - 1)) / 60);
    const rest = !s && restSuggested() && !state.trainAnyway;
    const topIdx = plan.indexOf(Math.max(...plan));

    let banner = "";
    if (rest) {
      banner = `<div class="banner rest"><h2>Rest day suggested</h2><p class="small">${esc(dog())} has trained ${(state.config.perWeek || 5)} days in the last week. A day off helps the progress stick. Keep any time alone today shorter than ${fmt(w)}.</p><div class="row"><button class="btn sm ghost" data-act="train-anyway">Train anyway</button></div></div>`;
    } else if (upset && !allDone && !state.ignoreUpset) {
      banner = `<div class="banner upset"><h2>Stop here for today</h2><p class="small">${esc(dog())} got upset. End with something fun: a walk, a sniff game, a chew. Tomorrow's plan steps back automatically.</p><div class="row"><button class="btn sm quiet" data-act="end-session">End today's session</button><button class="btn sm ghost" data-act="ignore-upset">Keep going</button></div></div>`;
    } else if (allDone && s) {
      const n = nextAfter(s);
      banner = `<div class="banner ${upset ? "upset" : "calm"}"><h2>Done for today</h2><p class="small">Tomorrow's longest rep will be about <b class="num">${fmt(roundDur(Math.max(3, n.w)))}</b>. ${esc(n.why.replace("last session", "today").replace("last time", "today").replace("so today", "so tomorrow"))}</p></div>`;
    }

    const repRows = plan.map((target, i) => {
      const r = repFor(i);
      let right;
      if (r) right = r.result === "skip" ? `<span class="pill skip">Skipped</span>` : `<span class="pill ${r.result}">${RESULTS[r.result].label}${r.actual && r.actual < r.target ? ` · ${fmt(r.actual)}` : ""}</span>`;
      else if (i === nextIdx && !rest) right = `<button class="btn sm" data-act="start" data-i="${i}">Start</button>`;
      else right = `<span class="small muted">to do</span>`;
      const sub = r && r.by ? `<div class="sub">${esc(personName(r.by))}${r.note ? " · " + esc(r.note) : ""}</div>` : i === nextIdx && !rest ? `<div class="sub">Up next</div>` : "";
      return `<li class="rep${i === nextIdx && !rest ? " next" : ""}${i === topIdx ? " top" : ""}"><span class="idx">${i + 1}</span><div><div class="dur">${fmt(target)}</div>${sub}</div>${right}</li>`;
    }).join("");

    return `
      <div class="top">
        <div><p class="eyebrow">${esc(niceDate(t))}</p><h1>${esc(dog())}'s plan today</h1></div>
      </div>
      <div class="stats">
        <div class="stat lead"><span class="eyebrow">Longest rep</span><b>${fmt(w)}</b></div>
        <div class="stat"><span class="eyebrow">Best calm</span><b>${bestCalmEver() ? fmt(bestCalmEver()) : "–"}</b></div>
        <div class="stat"><span class="eyebrow">Last 7 days</span><b>${weekCount()}/${state.config.perWeek || 5}</b></div>
      </div>
      ${banner}
      <div class="card">
        <div><h2>Before you start</h2><p class="why">${esc(s ? s.why : computed.why)}</p></div>
        <div class="cues">
          <p class="small">Departure cues: do each one 5 times, then sit back down. Don't leave. This takes the meaning out of the signals ${esc(dog())} watches for.</p>
          <div class="cue-list">${cues.map(c => `<span class="chip">${esc(c)}</span>`).join("")}</div>
          <label class="check"><input type="checkbox" id="cues-done" ${s && s.cuesDone ? "checked" : ""} ${rest ? "disabled" : ""}> Cues done</label>
        </div>
      </div>
      <div class="card">
        <div class="row" style="justify-content:space-between"><h2>Reps</h2><span class="small muted num">${plan.length} reps · about ${estMin} min</span></div>
        <p class="small muted">Go out the door, close it, come back when the timer ends. Come back early if ${esc(dog())} starts to stress. Between reps, sit calmly for 1–2 minutes until ${esc(dog())} settles.</p>
        <ol class="reps">${repRows}</ol>
        ${!rest ? `<div class="row"><button class="btn sm ghost" data-act="add-rep">Add a rep</button><input type="text" id="extra-dur" placeholder="e.g. 45s" style="width:8rem" autocomplete="off"></div>` : ""}
      </div>
      ${s ? `<div class="card"><label class="field">Notes for today<span class="muted small">What you noticed: triggers, what helped, who was home.</span><textarea id="notes">${esc(s.notes || "")}</textarea></label></div>` : ""}
    `;
  }

  function historyView() {
    const list = [...state.sessions.values()].filter(s => (s.reps || []).length).sort((a, b) => (a.date < b.date ? 1 : -1));
    if (!list.length) return `<div class="top"><div><p class="eyebrow">History</p><h1>Every session, both of you</h1></div></div><div class="card empty">No sessions yet. Finish a rep on the Today tab and it shows up here, with who trained and how ${esc(dog())} did.</div>`;
    return `
      <div class="top"><div><p class="eyebrow">History</p><h1>Every session, both of you</h1></div></div>
      <div class="card">
        <h2>Progress</h2>
        ${chart(list.slice().reverse())}
        <div class="legend"><span><i style="background:var(--accent)"></i>Longest planned rep</span><span><i style="background:var(--calm)"></i>Longest calm rep</span><span><i style="background:var(--upset)"></i>Got upset</span></div>
      </div>
      ${list.map(sessionCard).join("")}`;
  }

  function sessionCard(s) {
    const done = (s.reps || []).filter(r => r.result).sort((a, b) => a.i - b.i);
    const calm = done.filter(r => r.result === "calm");
    const best = calm.length ? Math.max(...calm.map(r => r.actual || r.target)) : 0;
    const who = [...new Set(done.map(r => r.by).filter(Boolean))];
    const open = state.openHistory.has(s.date);
    return `<div class="session">
      <div class="session-head"><b>${esc(niceDate(s.date, { weekday: "short", day: "numeric", month: "short" }))}</b><span class="small muted num">Longest ${fmt(s.working)}${best ? ` · best calm ${fmt(best)}` : ""}</span></div>
      <div class="dots">${done.map(r => `<span class="dot ${r.result === "skip" ? "none" : r.result}" title="${r.result === "skip" ? "Skipped" : RESULTS[r.result].label}">${fmt(r.actual || r.target)}</span>`).join("")}</div>
      <div class="row" style="justify-content:space-between">
        <div class="row">${who.map(name => `<span class="who">${esc(personName(name))}</span>`).join("")}</div>
        ${s.notes || done.some(r => r.note) ? `<button class="btn sm quiet" data-act="toggle-hist" data-d="${s.date}">${open ? "Hide notes" : "Notes"}</button>` : ""}
      </div>
      ${open ? `<div class="prose small">${s.notes ? `<p>${esc(s.notes)}</p>` : ""}${done.filter(r => r.note).map(r => `<p class="muted">Rep ${r.i + 1}: ${esc(r.note)}</p>`).join("")}</div>` : ""}
    </div>`;
  }

  function chart(asc) {
    const W = 560, H = 200, L = 52, R = 12, T = 12, B = 26;
    const pts = asc.map(s => {
      const done = doneReps(s);
      const calm = done.filter(r => r.result === "calm");
      return { date: s.date, w: s.working, best: calm.length ? Math.max(...calm.map(r => r.actual || r.target)) : null, upset: done.some(r => r.result === "upset") };
    });
    const max = Math.max(10, ...pts.map(p => Math.max(p.w, p.best || 0))) * 1.1;
    const x = i => (pts.length === 1 ? L + (W - L - R) / 2 : L + (i * (W - L - R)) / (pts.length - 1));
    const y = v => T + (H - T - B) * (1 - v / max);
    const ticks = [0, max / 2, max].map(v => roundDur(v));
    const line = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.w).toFixed(1)}`).join(" ");
    const area = `${line} L${x(pts.length - 1).toFixed(1)},${y(0)} L${x(0).toFixed(1)},${y(0)} Z`;
    const labelIdx = pts.length <= 2 ? pts.map((_, i) => i) : [0, Math.floor((pts.length - 1) / 2), pts.length - 1];
    return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Longest rep per session over time">
      ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`).join("")}
      <path d="${area}" fill="var(--accent-soft)" stroke="none"/>
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
      ${pts.map((p, i) => p.best != null ? `<circle cx="${x(i)}" cy="${y(p.best)}" r="4" fill="var(--calm)"/>` : "").join("")}
      ${pts.map((p, i) => p.upset ? `<circle cx="${x(i)}" cy="${y(p.w)}" r="5" fill="var(--surface)" stroke="var(--upset)" stroke-width="2.5"/>` : "").join("")}
      <circle cx="${x(pts.length - 1)}" cy="${y(pts[pts.length - 1].w)}" r="5" fill="var(--accent)"/>
      ${[...new Set(labelIdx)].map(i => `<text x="${x(i)}" y="${H - 6}" text-anchor="${pts.length > 1 && i === 0 ? "start" : pts.length > 1 && i === pts.length - 1 ? "end" : "middle"}">${esc(niceDate(pts[i].date, { day: "numeric", month: "short" }))}</text>`).join("")}
    </svg></div>`;
  }

  function settingsView() {
    const c = state.config;
    const today = state.sessions.get(todayStr());
    const w = today ? today.working : computeWorking().w;
    return `
      <div class="top"><div><p class="eyebrow">Settings</p><h1>Plan settings</h1></div></div>
      <div class="card">
        <label class="field">Dog's name<input type="text" id="set-name" value="${esc(c.dogName || "")}" autocomplete="off"></label>
        <label class="field">Training days per week<span class="muted small">After this many sessions in a week, the app suggests a rest day.</span>
          <select id="set-per">${[3, 4, 5, 6, 7].map(n => `<option ${n === (c.perWeek || 5) ? "selected" : ""}>${n}</option>`).join("")}</select></label>
        <label class="field">Longest session (minutes)<span class="muted small">Reps get dropped to fit, keeping the longest one.</span>
          <input type="number" id="set-cap" min="5" max="120" value="${c.capMin || 30}"></label>
        <button class="btn" data-act="save-settings">Save settings</button>
      </div>
      <div class="card">
        <h2>Reset the level</h2>
        <p class="small muted">Use this if something changed: a move, illness, a bad scare, or a trainer's advice. The next plan starts from this time. Right now it's <b class="num">${fmt(w)}</b>.</p>
        <div class="row"><input type="text" id="set-base" placeholder="e.g. 2m or 1:30" style="max-width:12rem" autocomplete="off"><button class="btn sm" data-act="set-base">Set level</button></div>
      </div>
      <div class="card">
        <div class="row" style="justify-content:space-between"><p>Logged in as <b>${esc(state.me)}</b></p><button class="btn sm quiet" data-act="logout">Log out</button></div>
      </div>
      <div class="card">
        <details>
          <summary>How the plan works</summary>
          <div class="prose">
            <p>The method is threshold training: ${esc(dog())} only practices alone time short enough to stay calm, and it grows in small steps.</p>
            <ul>
              <li>Each day has a <b>longest rep</b>. The other reps go up and down around it, so most reps are easier than the last one. That keeps the stress low.</li>
              <li>All calm through the longest rep: next session goes up about 15% (or +5 seconds for short times).</li>
              <li>Mild stress: next session steps back about 15%.</li>
              <li>Upset: stop for the day. The next session drops to 60% of where it went wrong.</li>
              <li>4 or more days off: the next session is 15% easier.</li>
              <li>Outside training, try not to leave ${esc(dog())} alone longer than the current level. Use a sitter, daycare or a friend while you build up.</li>
            </ul>
            <p class="muted small">This follows the common sub-threshold approach to separation anxiety. If ${esc(dog())} panics, hurts themself or doesn't improve over a few weeks, talk to your vet or a separation anxiety trainer.</p>
          </div>
        </details>
      </div>`;
  }

  // ---------- timer ----------
  const overlay = document.getElementById("overlay");
  let audio = null, wakeLock = null;
  function beep() {
    if (!audio) return;
    try {
      [0, 0.35].forEach(off => {
        const o = audio.createOscillator(), g = audio.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
        g.gain.setValueAtTime(0.0001, audio.currentTime + off);
        g.gain.exponentialRampToValueAtTime(0.3, audio.currentTime + off + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + off + 0.25);
        o.start(audio.currentTime + off); o.stop(audio.currentTime + off + 0.3);
      });
    } catch (e) {}
  }

  function startRep(i) {
    const s = ensureToday();
    const target = s.plan[i];
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume && audio.resume(); } catch (e) {}
    try { navigator.wakeLock && navigator.wakeLock.request("screen").then(l => (wakeLock = l)).catch(() => {}); } catch (e) {}
    state.timer = { i, target, start: Date.now(), done: false, actual: null, result: null };
    overlay.hidden = false;
    drawTimer();
    state.timer.tick = setInterval(drawTimer, 250);
  }

  function drawTimer() {
    const tm = state.timer; if (!tm) return;
    if (tm.phase === "outcome") return;
    const elapsed = (Date.now() - tm.start) / 1000;
    const left = tm.target - elapsed;
    if (left <= 0 && !tm.done) { tm.done = true; beep(); return finishTimer(tm.target); }
    const C = 2 * Math.PI * 46, frac = Math.min(1, elapsed / tm.target);
    if (!overlay.querySelector(".ring")) {
      overlay.innerHTML = `
        <div><p class="eyebrow">Rep ${tm.i + 1} · ${fmt(tm.target)}</p><h2 style="margin-top:6px">Step out and close the door</h2></div>
        <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="#223240" stroke-width="6"/><circle id="ring-fg" cx="50" cy="50" r="46" fill="none" stroke="#7d9bff" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg>
          <div class="clock"><b id="t-left" class="num">${clock(left)}</b><span class="small" style="color:#9fb2c2">left</span></div></div>
        <p class="small" style="color:#a9bac8;max-width:28rem">Come back in when it beeps. If ${esc(dog())} starts to stress, come back right away and end the rep.</p>
        <div class="row" style="justify-content:center"><button class="btn" id="t-early">I came back early</button><button class="btn quiet" id="t-cancel">Cancel rep</button></div>`;
      overlay.querySelector("#t-early").onclick = () => finishTimer(Math.round((Date.now() - tm.start) / 1000));
      overlay.querySelector("#t-cancel").onclick = closeTimer;
    }
    overlay.querySelector("#t-left").textContent = clock(left);
    overlay.querySelector("#ring-fg").setAttribute("stroke-dashoffset", (C * frac).toFixed(2));
  }

  function finishTimer(actual) {
    const tm = state.timer;
    clearInterval(tm.tick);
    tm.phase = "outcome"; tm.actual = Math.max(1, Math.min(actual, tm.target));
    const early = tm.actual < tm.target;
    overlay.innerHTML = `
      <div><p class="eyebrow">Rep ${tm.i + 1} · ${early ? `${fmt(tm.actual)} of ${fmt(tm.target)}` : fmt(tm.target)}</p><h2 style="margin-top:6px">${early ? "How was " + esc(dog()) + "?" : "Time's up. How was " + esc(dog()) + "?"}</h2></div>
      <div class="outcome">
        ${Object.entries(RESULTS).map(([k, v]) => `<button class="res ${k}" data-res="${k}" aria-pressed="${!early && k === "calm"}"><b>${v.label}</b><span>${v.hint}</span></button>`).join("")}
        <input type="text" id="t-note" placeholder="Note (optional)" autocomplete="off">
        <div class="row"><button class="btn" id="t-save">Save rep</button><button class="btn quiet" id="t-skip">Didn't do it</button></div>
      </div>`;
    tm.result = early ? null : "calm";
    overlay.querySelectorAll(".res").forEach(b => (b.onclick = () => { tm.result = b.dataset.res; overlay.querySelectorAll(".res").forEach(x => x.setAttribute("aria-pressed", x === b)); }));
    overlay.querySelector("#t-save").onclick = () => { if (!tm.result) return toast("Pick how it went first."); recordRep(tm.result, overlay.querySelector("#t-note").value.trim()); };
    overlay.querySelector("#t-skip").onclick = () => recordRep("skip", "");
  }

  function recordRep(result, note) {
    const tm = state.timer, t = todayStr();
    const s = state.sessions.get(t) || ensureToday();
    const reps = (s.reps || []).filter(r => r.i !== tm.i).concat([{ i: tm.i, target: tm.target, actual: result === "skip" ? 0 : tm.actual, result, note, by: state.me, at: Date.now() }]);
    if (result === "upset") state.ignoreUpset = false;
    saveSession(t, { reps });
    closeTimer();
  }

  function closeTimer() {
    if (state.timer) clearInterval(state.timer.tick);
    state.timer = null; overlay.hidden = true; overlay.innerHTML = "";
    try { wakeLock && wakeLock.release(); } catch (e) {}
    wakeLock = null;
    render();
  }

  // ---------- events ----------
  document.getElementById("tabs").addEventListener("click", e => {
    const b = e.target.closest("button[data-tab]"); if (!b) return;
    state.tab = b.dataset.tab; render(); window.scrollTo(0, 0);
    try { localStorage.setItem("yeti-tab", state.tab); } catch (err) {}
  });

  appEl.addEventListener("click", e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const act = b.dataset.act, t = todayStr();
    if (act === "start") startRep(+b.dataset.i);
    else if (act === "logout") { api("/api/logout", { method: "POST" }).catch(() => {}).finally(() => { state.me = null; state.configLoaded = false; lastSnapshot = ""; render(); }); }
    else if (act === "train-anyway") { state.trainAnyway = true; render(); }
    else if (act === "ignore-upset") { state.ignoreUpset = true; render(); }
    else if (act === "end-session") {
      const s = state.sessions.get(t); if (!s) return;
      const reps = s.reps.slice();
      s.plan.forEach((target, i) => { if (!reps.find(r => r.i === i)) reps.push({ i, target, actual: 0, result: "skip", note: "", by: state.me, at: Date.now() }); });
      saveSession(t, { reps });
    } else if (act === "add-rep") {
      const v = parseDur(document.getElementById("extra-dur").value);
      if (!v) return toast("Type a time first, like 45s or 2m.");
      const s = ensureToday();
      saveSession(t, { plan: s.plan.concat([v]) });
    } else if (act === "toggle-hist") {
      const d = b.dataset.d; state.openHistory.has(d) ? state.openHistory.delete(d) : state.openHistory.add(d); render();
    } else if (act === "save-settings") {
      const cap = Math.min(120, Math.max(5, +document.getElementById("set-cap").value || 30));
      saveConfig({ dogName: document.getElementById("set-name").value.trim() || "Yeti", perWeek: +document.getElementById("set-per").value, capMin: cap });
      toast("Settings saved.");
    } else if (act === "set-base") {
      const v = parseDur(document.getElementById("set-base").value);
      if (!v) return toast("Type a time like 2m, 90s or 1:30.");
      saveConfig({ base: { seconds: v, setOn: t, setAt: Date.now() } });
      const s = state.sessions.get(t);
      if (s && !doneReps(s).length) saveSession(t, { working: roundDur(v), why: `Starting from the level you set: ${fmt(v)}.`, plan: buildPlan(roundDur(v), t) });
      toast(`Level set to ${fmt(v)}.`);
    }
  });

  appEl.addEventListener("change", e => {
    if (e.target.id === "cues-done") { ensureToday(); saveSession(todayStr(), { cuesDone: e.target.checked }); }
  });
  appEl.addEventListener("focusout", e => {
    if (e.target.id === "notes") {
      const t = todayStr(), s = state.sessions.get(t), v = e.target.value;
      if (s && s.notes !== v) setTimeout(() => saveSession(t, { notes: v }));
      else setTimeout(render);
    }
  });

  // ---------- boot ----------
  try { const tab = localStorage.getItem("yeti-tab"); if (tab) state.tab = tab; } catch (e) {}

  (async () => {
    try {
      const r = await fetch("/api/me", { credentials: "same-origin" });
      if (r.ok) state.me = (await r.json()).name;
      else if (r.status !== 401) {
        const body = await r.json().catch(() => ({}));
        appEl.innerHTML = `<div class="card empty">${esc(body.error || "The server isn't working right now. Try again in a minute.")}</div>`;
        return;
      }
    } catch (e) {
      appEl.innerHTML = `<div class="card empty">Can't reach the server. Check your connection and reload.</div>`;
      return;
    }
    state.authChecked = true;
    render();
    if (state.me) load();
  })();
  const refresh = () => { if (state.me && document.visibilityState === "visible") load(); };
  setInterval(refresh, 15000);
  document.addEventListener("visibilitychange", refresh);
})();
</script>
</body>
</html>
