  // ---------- timer ----------
  const overlay = document.getElementById("overlay");
  let audio = null, wakeLock = null;
  function beep() {
    if (!audio) return;
    try {
      [0, 0.35].forEach(off => {
        const o = audio.createOscillator(), g = audio.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
        g.gain.setValueAtTime(0.0001, audio.currentTime + off);
        g.gain.exponentialRampToValueAtTime(0.3, audio.currentTime + off + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + off + 0.25);
        o.start(audio.currentTime + off); o.stop(audio.currentTime + off + 0.3);
      });
    } catch (e) {}
  }

  // A "time's up" push scheduled on the server, so it arrives even if the phone is locked or in another app.
  async function repAlertsOn(tm) {
    if (!push.sub || !push.prefs) return;
    try {
      const r = await api("/api/rep-alert", { method: "POST", body: JSON.stringify({ endpoint: push.sub.endpoint, endsAt: tm.start + tm.target * 1000, title: `Time's up · rep ${tm.i + 1}`, body: `Go back in to ${dog()}, then log how it went.` }) });
      if (!r.messageId) return;
      if (state.timer === tm && !tm.alertsOff) tm.alertId = r.messageId;
      else api("/api/rep-alert", { method: "DELETE", body: JSON.stringify({ messageId: r.messageId }) }).catch(() => {}); // rep already over
    } catch (e) { console.error(e); }
  }
  function repAlertsOff(tm) {
    if (!tm || tm.alertsOff) return;
    tm.alertsOff = true;
    if (tm.alertId) api("/api/rep-alert", { method: "DELETE", body: JSON.stringify({ messageId: tm.alertId }) }).catch(() => {});
    if (push.reg && push.reg.getNotifications) push.reg.getNotifications({ tag: "rep" }).then(ns => ns.forEach(n => n.close())).catch(() => {});
  }

  // Ask the phone to keep the screen on during a rep (the timer can't beep from a locked phone).
  // The lock drops when the app is hidden, so ask again when it comes back.
  function keepAwake() {
    try { if (navigator.wakeLock && !wakeLock) navigator.wakeLock.request("screen").then(l => { wakeLock = l; l.addEventListener("release", () => (wakeLock = null)); }).catch(() => {}); } catch (e) {}
  }
  document.addEventListener("visibilitychange", () => { if (state.timer && document.visibilityState === "visible") { keepAwake(); drawTimer(); } });

  function startRep(i) {
    const s = ensureToday();
    const target = s.plan[i];
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume && audio.resume(); } catch (e) {}
    keepAwake();
    const door = sessionMode(s) === "door";
    state.timer = { i, target, start: Date.now(), done: false, actual: null, result: null, phase: door ? "leaving" : "run", door };
    overlay.hidden = false;
    drawTimer();
    state.timer.tick = setInterval(drawTimer, 250);
    if (!door) repAlertsOn(state.timer);
  }

  function drawTimer() {
    const tm = state.timer; if (!tm) return;
    if (tm.phase === "outcome") return;
    if (tm.phase === "leaving") {
      if (!overlay.querySelector("#t-out")) {
        overlay.innerHTML = `
          <div><p class="eyebrow">Rep ${tm.i + 1} · ${fmt(tm.target)}</p><h2 style="margin-top:6px">Head out through both doors</h2></div>
          <p class="small" style="color:#b4aaa0;max-width:28rem">Tap "I'm out" once both doors are shut behind you. The timer starts then.</p>
          <div class="row" style="justify-content:center"><button class="btn" id="t-out">I'm out</button><button class="btn quiet" id="t-cancel">Cancel rep</button></div>`;
        overlay.querySelector("#t-out").onclick = () => { tm.phase = "run"; tm.start = Date.now(); overlay.innerHTML = ""; drawTimer(); repAlertsOn(tm); };
        overlay.querySelector("#t-cancel").onclick = closeTimer;
      }
      return;
    }
    const elapsed = (Date.now() - tm.start) / 1000;
    const left = tm.target - elapsed;
    // At the planned time: beep, then keep counting so you can stay out longer if the dog is relaxed.
    if (left <= 0 && !tm.done) { tm.done = true; tm.overtime = true; beep(); try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) {} }
    const C = 2 * Math.PI * 46, frac = Math.min(1, elapsed / tm.target);
    if (tm.overtime) {
      if (overlay.dataset.mode !== "overtime") {
        overlay.dataset.mode = "overtime";
        overlay.innerHTML = `
          <div><p class="eyebrow">Rep ${tm.i + 1} · planned ${fmt(tm.target)}</p><h2 style="margin-top:6px">Time's up</h2></div>
          <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="#5ccf97" stroke-width="6"/></svg>
            <div class="clock"><b id="t-over" class="num" style="color:#5ccf97"></b><span class="small" style="color:#b4aaa0">extra time</span></div></div>
          <p class="small" style="color:#b4aaa0;max-width:28rem">Go back in now, or stay out a little longer if ${esc(dog())} is relaxed. Come straight back at the first sign of stress. Tap "I'm back" when you're in.</p>
          <div class="row" style="justify-content:center"><button class="btn" id="t-back">I'm back</button><button class="btn quiet" id="t-note-add">+ Note</button><button class="btn quiet" id="t-cancel">Cancel rep</button></div>
          ${momentControls()}`;
        overlay.querySelector("#t-back").onclick = () => finishTimer((Date.now() - tm.start) / 1000);
        overlay.querySelector("#t-cancel").onclick = closeTimer;
        wireMoments(tm);
      }
      overlay.querySelector("#t-over").textContent = "+" + clock(-left);
      return;
    }
    if (!overlay.querySelector(".ring")) {
      overlay.innerHTML = `
        <div><p class="eyebrow">Rep ${tm.i + 1} · ${fmt(tm.target)}</p><h2 style="margin-top:6px">${tm.door ? "You're out. Stay out" : "Close the gate and go out of sight"}</h2></div>
        <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="#36302c" stroke-width="6"/><circle id="ring-fg" cx="50" cy="50" r="46" fill="none" stroke="#e39a57" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg>
          <div class="clock"><b id="t-left" class="num">${clock(left)}</b><span class="small" style="color:#b4aaa0">left</span></div></div>
        <p class="small" style="color:#b4aaa0;max-width:28rem">Come back in when it beeps. If ${esc(dog())} starts to stress, come back right away and end the rep. Keep this screen open: a locked phone can't beep.</p>
        <div class="row" style="justify-content:center"><button class="btn" id="t-early">I came back early</button><button class="btn quiet" id="t-note-add">+ Note</button><button class="btn quiet" id="t-cancel">Cancel rep</button></div>
        ${momentControls()}`;
      overlay.querySelector("#t-early").onclick = () => finishTimer(Math.round((Date.now() - tm.start) / 1000));
      overlay.querySelector("#t-cancel").onclick = closeTimer;
      wireMoments(tm);
    }
    overlay.querySelector("#t-left").textContent = clock(left);
    overlay.querySelector("#ring-fg").setAttribute("stroke-dashoffset", (C * frac).toFixed(2));
  }

  function finishTimer(actual) {
    const tm = state.timer;
    clearInterval(tm.tick);
    repAlertsOff(tm);
    overlay.dataset.mode = "";
    // Within a second of the plan counts as exactly on time.
    const secs = Math.max(1, Math.round(actual));
    tm.phase = "outcome"; tm.actual = Math.abs(secs - tm.target) <= 1 ? tm.target : secs;
    const early = tm.actual < tm.target, over = tm.actual > tm.target;
    const moments = tm.moments || [];
    const worst = ["upset", "mild"].find(r => moments.some(m => m.result === r));
    tm.result = worst || (early ? null : "calm");
    overlay.innerHTML = `
      <div><p class="eyebrow">Rep ${tm.i + 1} · ${early ? `${fmt(tm.actual)} of ${fmt(tm.target)}` : over ? `${fmt(tm.actual)}, planned ${fmt(tm.target)}` : fmt(tm.target)}</p><h2 style="margin-top:6px">How was ${esc(dog())}?</h2>
        ${moments.length ? `<p class="small" style="color:#b4aaa0;margin-top:6px">During the rep: ${esc(momentText({ moments }))}</p>` : ""}</div>
      <div class="outcome">
        ${Object.entries(RESULTS).map(([k, v]) => `<button class="res ${k}" data-res="${k}" aria-pressed="${k === tm.result}"><b>${v.label}</b><span>${v.hint}</span></button>`).join("")}
        <div id="tag-box"></div>
        <input type="text" id="t-note" placeholder="Note (optional)" autocomplete="off">
        <div class="row"><button class="btn" id="t-save">Save rep</button><button class="btn quiet" id="t-skip">Didn't do it</button></div>
      </div>`;
    const picker = tagPicker(tm.result, moments.filter(m => m.tag).map(m => m.tag));
    wireResults(v => { tm.result = v; picker.setResult(v); });
    overlay.querySelector("#t-save").onclick = () => { if (!tm.result) return toast("Pick how it went first."); recordRep(tm.result, overlay.querySelector("#t-note").value.trim(), picker.tags()); };
    overlay.querySelector("#t-skip").onclick = () => recordRep("skip", "");
  }

  function recordRep(result, note, tags = []) {
    const tm = state.timer, t = todayStr();
    const s = state.sessions.get(t) || ensureToday();
    if (result === "upset") state.ignoreUpset = false;
    saveReps(t, [{ i: tm.i, target: tm.target, actual: result === "skip" ? 0 : tm.actual, result, tags: result === "skip" ? [] : tags, moments: tm.moments || [], note, setup: (state.sessions.get(t) || {}).setup || lastSetup(), by: state.me, startedAt: tm.start, at: Date.now() }]);
    closeTimer();
  }

  function closeTimer() {
    if (state.timer) { clearInterval(state.timer.tick); repAlertsOff(state.timer); }
    state.timer = null; overlay.hidden = true; overlay.innerHTML = ""; overlay.dataset.mode = "";
    try { wakeLock && wakeLock.release(); } catch (e) {}
    wakeLock = null;
    render();
  }

  // ---------- setup: how the dog is left during a session ----------
  const SETUPS = { gate: "Behind the gate", "gate-open": "Gate open", free: "Free in the flat" };
  const SETUP_ORDER = Object.keys(SETUPS); // easiest first
  const lastSetup = () => (state.config && SETUPS[state.config.lastSetup] ? state.config.lastSetup : "gate");
  const setupButtons = (selected, act) => `<div class="periods">${SETUP_ORDER.map(k => `<button type="button" data-act="${act}" data-v="${k}" aria-pressed="${k === selected}">${SETUPS[k]}</button>`).join("")}</div>`;

  // ---------- tags: what you saw, picked after the result ----------
  const TAGS = {
    calm: ["Lay down", "Settled on bed", "Slept", "Busy with a chew", "Sniffed around", "Slow to greet"],
    mild: ["Whined", "Paced", "Waited by the gate or door", "Listened at the door", "Yawned or lip-licked", "Left the chew", "Panted"],
    upset: ["Barked", "Howled", "Scratched gate or door", "Heavy panting", "Drooled", "Tried to get out", "Had an accident", "Frantic greeting"],
  };
  const tagsFor = result => (TAGS[result] || []).concat(((state.config && state.config.customTags) || {})[result] || []);
  function addCustomTag(result, label) {
    const custom = { ...(state.config.customTags || {}) };
    if (tagsFor(result).includes(label)) return;
    custom[result] = [...(custom[result] || []), label].slice(-20);
    saveConfig({ customTags: custom });
  }
  // Draws the tag chips for the chosen result into #tag-box; tags that don't belong to a newly picked result are dropped.
  function tagPicker(initialResult, initialTags) {
    const picked = new Set(initialTags || []);
    let result = initialResult;
    const box = overlay.querySelector("#tag-box");
    const draw = () => {
      const list = tagsFor(result);
      for (const t of [...picked]) if (!list.includes(t)) picked.delete(t);
      box.innerHTML = TAGS[result] ? `<p class="eyebrow">What did you see? Optional</p>
        <div class="tags">${list.map(t => `<button type="button" class="tag" data-tag="${esc(t)}" aria-pressed="${picked.has(t)}">${esc(t)}</button>`).join("")}<button type="button" class="tag add" data-add>+ Other</button></div>` : "";
      box.querySelectorAll("[data-tag]").forEach(b => (b.onclick = () => {
        const t = b.dataset.tag;
        picked.has(t) ? picked.delete(t) : picked.add(t);
        b.setAttribute("aria-pressed", picked.has(t));
      }));
      const add = box.querySelector("[data-add]");
      if (add) add.onclick = () => {
        add.outerHTML = `<span class="tags"><input type="text" id="tag-new" maxlength="40" placeholder="Your own tag" style="width:11rem"><button type="button" class="tag" data-add-ok>Add</button></span>`;
        const input = box.querySelector("#tag-new");
        const ok = () => { const v = input.value.trim(); if (v) { addCustomTag(result, v); picked.add(v); } draw(); };
        box.querySelector("[data-add-ok]").onclick = ok;
        input.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); ok(); } };
        input.focus();
      };
    };
    draw();
    return { setResult(r) { result = r; draw(); }, tags: () => [...picked] };
  }
  // Notes taken during a rep: { t: seconds into the rep, tag | note, result (for tags) }.
  const momentText = r => (r.moments || []).map(m => `${clock(m.t)} ${m.tag || m.note}`).join(", ");
  const repTags = r => [...new Set([...(r.tags || []), ...(r.moments || []).filter(m => m.tag).map(m => m.tag)])];
  function momentControls() {
    return `<p id="moment-list" class="small" style="color:#b4aaa0;max-width:28rem;margin:0"></p><div id="moment-box" class="outcome" hidden></div>`;
  }
  function wireMoments(tm) {
    const list = overlay.querySelector("#moment-list"), box = overlay.querySelector("#moment-box");
    const drawList = () => { list.textContent = (tm.moments || []).length ? `Noted: ${momentText(tm)}` : ""; };
    const add = m => {
      const t = Math.round((Date.now() - tm.start) / 1000);
      tm.moments = (tm.moments || []).concat([{ t, ...m }]);
      drawList(); box.hidden = true;
      toast(`Noted at ${clock(t)}: ${m.tag || m.note}`);
    };
    overlay.querySelector("#t-note-add").onclick = () => {
      if (!box.hidden) { box.hidden = true; return; }
      box.innerHTML = ["calm", "mild", "upset"].map(res => `<div class="tags">${tagsFor(res).map(t => `<button type="button" class="tag ${res}" data-mtag="${esc(t)}" data-mres="${res}">${esc(t)}</button>`).join("")}</div>`).join("")
        + `<div class="tags"><input type="text" id="m-note-text" maxlength="200" placeholder="Or type a note" style="flex:1;min-width:0"><button type="button" class="tag" id="m-note-save">Add</button></div>`;
      box.hidden = false;
      box.querySelectorAll("[data-mtag]").forEach(b => (b.onclick = () => add({ tag: b.dataset.mtag, result: b.dataset.mres })));
      const input = box.querySelector("#m-note-text");
      const save = () => { const v = input.value.trim(); if (v) add({ note: v }); };
      box.querySelector("#m-note-save").onclick = save;
      input.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); save(); } };
    };
    drawList();
  }
  const tagCounts = reps => {
    const m = new Map();
    for (const r of reps) for (const t of repTags(r)) m.set(t, (m.get(t) || 0) + 1);
    return [...m.entries()].sort((a, b) => b[1] - a[1]);
  };
  const tagLine = reps => tagCounts(reps).map(([t, n]) => esc(t) + (n > 1 ? ` ×${n}` : "")).join(" · ");

  // ---------- editing a logged rep, logging a real absence ----------
  function sheet(html) { overlay.hidden = false; overlay.innerHTML = html; }
  function closeSheet() { overlay.hidden = true; overlay.innerHTML = ""; render(); }
  function resultButtons(selected, extra = {}) {
    return Object.entries({ ...RESULTS, ...extra }).map(([k, v]) => `<button type="button" class="res ${k}" data-res="${k}" aria-pressed="${k === selected}"><b>${v.label}</b><span>${v.hint}</span></button>`).join("");
  }
  function wireResults(onPick) {
    overlay.querySelectorAll(".res").forEach(b => (b.onclick = () => { onPick(b.dataset.res); overlay.querySelectorAll(".res").forEach(x => x.setAttribute("aria-pressed", x === b)); }));
  }

  function editRep(date, i) {
    const s = state.sessions.get(date); const r = s && (s.reps || []).find(x => x.i === i); if (!r) return;
    let result = r.result === "skip" ? null : r.result;
    sheet(`
      <div><p class="eyebrow">${esc(niceDate(date, { weekday: "short", day: "numeric", month: "short" }))} · rep ${i + 1} · planned ${fmt(r.target)}</p><h2 style="margin-top:6px">Change this rep</h2>
        ${r.moments && r.moments.length ? `<p class="small" style="color:#b4aaa0;margin-top:6px">During the rep: ${esc(momentText(r))}</p>` : ""}</div>
      <div class="outcome">
        ${resultButtons(result)}
        <div id="tag-box"></div>
        <input type="text" id="e-actual" value="${r.result === "skip" ? "" : fmt(r.actual || r.target)}" placeholder="How long it lasted, e.g. 1m 30s" autocomplete="off">
        <input type="text" id="e-note" value="${esc(r.note || "")}" placeholder="Note (optional)" autocomplete="off">
        <div class="row"><button class="btn" id="e-save">Save changes</button><button class="btn quiet" id="e-delete">Delete rep</button><button class="btn quiet" id="e-cancel">Cancel</button></div>
      </div>`);
    const picker = tagPicker(result, r.tags);
    wireResults(v => { result = v; picker.setResult(v); });
    overlay.querySelector("#e-cancel").onclick = closeSheet;
    overlay.querySelector("#e-delete").onclick = () => { deleteRep(date, i); closeSheet(); toast(`Rep ${i + 1} deleted. You can do it again.`); };
    overlay.querySelector("#e-save").onclick = () => {
      if (!result) return toast("Pick how it went first.");
      const actual = parseDur(overlay.querySelector("#e-actual").value) || r.target;
      saveReps(date, [{ ...r, result, actual, tags: picker.tags(), note: overlay.querySelector("#e-note").value.trim(), editedBy: state.me, editedAt: Date.now() }]);
      closeSheet(); toast("Rep updated.");
    };
  }

  // A rep done without starting the timer (e.g. one long stretch behind the gate). Added to today's plan as done.
  function manualRepSheet() {
    let result = "calm";
    const now = new Date();
    sheet(`
      <div><p class="eyebrow">${esc(niceDate(todayStr(), { weekday: "short", day: "numeric", month: "short" }))}</p><h2 style="margin-top:6px">Log a rep without the timer</h2></div>
      <div class="outcome">
        <p class="small" style="color:#b4aaa0">For time ${esc(dog())} spent alone in training when you didn't start a rep in the app. It counts for the plan like any other rep.</p>
        <div class="row">
          <input type="text" id="m-dur" placeholder="How long, e.g. 12m" autocomplete="off" style="flex:1">
          <input type="time" id="m-time" value="${pad(now.getHours())}:${pad(now.getMinutes())}" aria-label="When it ended" style="flex:1">
        </div>
        ${resultButtons(result)}
        <div id="tag-box"></div>
        <input type="text" id="m-note" placeholder="Note (optional)" autocomplete="off">
        <div class="row"><button class="btn" id="m-save">Save rep</button><button class="btn quiet" id="m-cancel">Cancel</button></div>
      </div>`);
    const picker = tagPicker(result, []);
    wireResults(v => { result = v; picker.setResult(v); });
    overlay.querySelector("#m-cancel").onclick = closeSheet;
    overlay.querySelector("#m-save").onclick = () => {
      const secs = parseDur(overlay.querySelector("#m-dur").value);
      if (!secs) return toast("Type how long, like 12m or 1:30.");
      const t = todayStr(), s = ensureToday();
      const [hh, mm] = (overlay.querySelector("#m-time").value || `${pad(now.getHours())}:${pad(now.getMinutes())}`).split(":").map(Number);
      const at = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm).getTime();
      const i = s.plan.length;
      saveSession(t, { plan: s.plan.concat([secs]) });
      saveReps(t, [{ i, target: secs, actual: secs, result, tags: picker.tags(), note: overlay.querySelector("#m-note").value.trim(), setup: s.setup || lastSetup(), by: state.me, startedAt: at - secs * 1000, at, manual: true }]);
      closeSheet(); toast(`Logged ${fmt(secs)}.`);
    };
  }

  function absenceSheet(existing) {
    const a = existing || null;
    const now = new Date();
    const startDefault = a ? new Date(a.start) : new Date(now.getTime() - 60 * 60 * 1000);
    const day = d => (dateStr(d) === todayStr() ? "today" : dateStr(d) === dateStr(new Date(now.getTime() - 864e5)) ? "yesterday" : "other");
    let result = a ? a.result : null;
    sheet(`
      <div><p class="eyebrow">Real absence</p><h2 style="margin-top:6px">${a ? "Change time alone" : `When was ${esc(dog())} left alone?`}</h2></div>
      <div class="outcome">
        <p class="small" style="color:#b4aaa0">For times you had to leave ${esc(dog())} alone outside training: work, errands, appointments.</p>
        <div class="row">
          <select id="a-day" style="flex:1"><option value="today" ${day(startDefault) === "today" ? "selected" : ""}>Today</option><option value="yesterday" ${day(startDefault) === "yesterday" ? "selected" : ""}>Yesterday</option>${day(startDefault) === "other" ? `<option value="${dateStr(startDefault)}" selected>${esc(niceDate(dateStr(startDefault), { day: "numeric", month: "short" }))}</option>` : ""}</select>
          <input type="time" id="a-time" value="${pad(startDefault.getHours())}:${pad(startDefault.getMinutes())}" style="flex:1">
        </div>
        <input type="text" id="a-dur" value="${a ? fmt(a.seconds) : ""}" placeholder="How long, e.g. 2h or 45m" autocomplete="off">
        <select id="a-setup" aria-label="How ${esc(dog())} was left">${SETUP_ORDER.map(k => `<option value="${k}" ${k === ((a && a.setup) || "free") ? "selected" : ""}>${SETUPS[k]}</option>`).join("")}</select>
        ${resultButtons(result, { unknown: { label: "Don't know", hint: "No camera, or didn't watch" } })}
        <div id="tag-box"></div>
        <input type="text" id="a-note" value="${esc(a ? a.note : "")}" placeholder="Note (optional)" autocomplete="off">
        <div class="row"><button class="btn" id="a-save">Save</button>${a ? `<button class="btn quiet" id="a-delete">Delete</button>` : ""}<button class="btn quiet" id="a-cancel">Cancel</button></div>
      </div>`);
    const picker = tagPicker(result, a && a.tags);
    wireResults(v => { result = v; picker.setResult(v); });
    overlay.querySelector("#a-cancel").onclick = closeSheet;
    if (a) overlay.querySelector("#a-delete").onclick = () => { deleteAbsence(a.id); closeSheet(); toast("Deleted."); };
    overlay.querySelector("#a-save").onclick = () => {
      const seconds = parseDur(overlay.querySelector("#a-dur").value);
      if (!seconds) return toast("Type how long, like 2h or 45m.");
      if (!result) return toast("Pick how it went, or Don't know.");
      const dayVal = overlay.querySelector("#a-day").value;
      const date = dayVal === "today" ? todayStr() : dayVal === "yesterday" ? dateStr(new Date(now.getTime() - 864e5)) : dayVal;
      const [hh, mm] = (overlay.querySelector("#a-time").value || "12:00").split(":").map(Number);
      const start = new Date(+date.slice(0, 4), +date.slice(5, 7) - 1, +date.slice(8, 10), hh, mm).getTime();
      saveAbsence({ id: a ? a.id : newId(), date, start, seconds, setup: overlay.querySelector("#a-setup").value, result, tags: picker.tags(), note: overlay.querySelector("#a-note").value.trim(), by: a ? a.by : state.me });
      closeSheet(); toast("Saved.");
    };
  }

  // ---------- events ----------
  document.getElementById("tabs").addEventListener("click", e => {
    const b = e.target.closest("button[data-tab]"); if (!b) return;
    state.tab = b.dataset.tab; render(); window.scrollTo(0, 0);
    try { localStorage.setItem("yeti-tab", state.tab === "report" ? "history" : state.tab); } catch (err) {}
  });

  appEl.addEventListener("click", e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const act = b.dataset.act, t = todayStr();
    if (act === "start") startRep(+b.dataset.i);
    else if (act === "edit-rep") editRep(b.dataset.d, +b.dataset.i);
    else if (act === "set-setup") {
      const v = b.dataset.v, s = ensureToday();
      const prev = s.setup || lastSetup();
      if (v === prev) return;
      saveSession(t, { setup: v });
      saveConfig({ lastSetup: v });
      if (SETUP_ORDER.indexOf(v) > SETUP_ORDER.indexOf(prev)) {
        toast(doneReps(s).length
          ? `Setup changed to "${SETUPS[v].toLowerCase()}". This is harder for ${dog()}: keep the rest of today's reps short.`
          : `"${SETUPS[v]}" is harder for ${dog()}. Consider lowering the level in Settings → Reset the level.`);
      }
    }
    else if (act === "open-report") { state.tab = "report"; render(); window.scrollTo(0, 0); }
    else if (act === "back-history") { state.tab = "history"; render(); window.scrollTo(0, 0); }
    else if (act === "report-period") { state.report = { ...(state.report || {}), period: b.dataset.p }; render(); }
    else if (act === "report-pdf") exportReport("pdf");
    else if (act === "report-png") exportReport("png");
    else if (act === "log-absence") absenceSheet(null);
    else if (act === "log-manual") manualRepSheet();
    else if (act === "edit-absence") absenceSheet(state.absences.find(a => a.id === b.dataset.id));
    else if (act === "logout") { api("/api/logout", { method: "POST" }).catch(() => {}).finally(() => { state.me = null; state.configLoaded = false; lastSnapshot = ""; render(); }); }
    else if (act === "toggle-hint") {
      state.hints[b.dataset.k] = !state.hints[b.dataset.k];
      try { localStorage.setItem("yeti-hints", JSON.stringify(state.hints)); } catch (e) {}
      render();
    }
    else if (act === "push-on") turnOnPush();
    else if (act === "push-off") turnOffPush();
    else if (act === "push-test") testPush();
    else if (act === "goto-settings") { state.tab = "settings"; render(); window.scrollTo(0, 0); }
    else if (act === "goto-guide") { state.tab = "guide"; render(); window.scrollTo(0, 0); }
    else if (act === "guide-next") guideNext();
    else if (act === "guide-set") { saveConfig({ guideStep: +b.dataset.step }); toast("Step changed. Check the stage, setup and level in Settings match it."); }
    else if (act === "pick-stage") { state.stagePick = b.dataset.mode; render(); }
    else if (act === "switch-stage") {
      const mode = state.stagePick || curMode();
      const typed = document.getElementById("stage-base").value.trim();
      const v = typed ? parseDur(typed) : null;
      if (typed && !v) return toast("Type a time like 2m, 90s or 1:30, or leave it empty.");
      const seconds = v || (getBase(mode) ? null : STAGES[mode].defaultStart);
      const now = setStage(mode, seconds) === "now";
      state.stagePick = null;
      toast(now ? `Switched to ${STAGES[mode].label.toLowerCase()}. Today's plan is updated.` : `Switched to ${STAGES[mode].label.toLowerCase()}. It starts with tomorrow's session, since reps are already done today.`);
    }
    else if (act === "train-anyway") { state.trainAnyway = true; render(); }
    else if (act === "ignore-upset") { state.ignoreUpset = true; render(); }
    else if (act === "end-session") {
      const s = state.sessions.get(t); if (!s) return;
      const skips = s.plan.map((target, i) => ({ i, target, actual: 0, result: "skip", note: "", by: state.me, at: Date.now() })).filter(r => !(s.reps || []).find(x => x.i === r.i));
      if (skips.length) saveReps(t, skips);
    } else if (act === "add-rep") {
      const v = parseDur(document.getElementById("extra-dur").value);
      if (!v) return toast("Type a time first, like 45s or 2m.");
      const s = ensureToday();
      saveSession(t, { plan: s.plan.concat([v]) });
    } else if (act === "toggle-hist") {
      const d = b.dataset.d; state.openHistory.has(d) ? state.openHistory.delete(d) : state.openHistory.add(d); render();
    } else if (act === "save-settings") {
      const cap = Math.min(120, Math.max(5, +document.getElementById("set-cap").value || 30));
      saveConfig({ dogName: document.getElementById("set-name").value.trim() || "Yeti", perWeek: +document.getElementById("set-per").value, capMin: cap });
      toast("Settings saved.");
    } else if (act === "set-base") {
      const v = parseDur(document.getElementById("set-base").value);
      if (!v) return toast("Type a time like 2m, 90s or 1:30.");
      const when = setStage(curMode(), v);
      const s = state.sessions.get(t);
      toast(when === "tomorrow" ? `Level set to ${fmt(v)}. It starts with tomorrow's session.`
        : s && doneReps(s).length ? `Level set to ${fmt(roundDur(v))}. The rest of today's reps use it.`
        : `Level set to ${fmt(roundDur(v))}. Today's plan is updated.`);
    }
  });

  appEl.addEventListener("change", e => {
    if ("keepGate" in e.target.dataset) {
      saveConfig({ keepGate: e.target.checked });
      toast(e.target.checked ? "Keeping the gate: the gate-open step is skipped." : "The gate-open step is back in the Guide.");
      return;
    }
    if (e.target.dataset.guideCheck) {
      saveConfig({ guideChecks: { ...(state.config.guideChecks || {}), [e.target.dataset.guideCheck]: e.target.checked } });
      return;
    }
    if (e.target.id === "rp-from" || e.target.id === "rp-to") {
      state.report = { ...state.report, period: "custom", from: document.getElementById("rp-from").value, to: document.getElementById("rp-to").value };
      render(); return;
    }
    if (["push-morning", "push-evening", "push-weekly", "push-morning-time", "push-evening-time"].includes(e.target.id)) {
      if (push.busy) return;
      const val = id => { const el = document.getElementById(id); return el ? el.value : undefined; };
      const picked = e.target.type === "time" ? e.target.value : null;
      savePushPrefs({
        morning: document.getElementById("push-morning").checked, evening: document.getElementById("push-evening").checked, weekly: document.getElementById("push-weekly").checked,
        morningTime: val("push-morning-time") || push.prefs.morningTime, eveningTime: val("push-evening-time") || push.prefs.eveningTime,
      });
      if (picked) toast(`Reminder set for ${picked}.`);
      return;
    }
    if (e.target.id === "cues-done") { ensureToday(); saveSession(todayStr(), { cuesDone: e.target.checked }); }
  });
  appEl.addEventListener("focusout", e => {
    if (e.target.id === "notes") {
      const t = todayStr(), s = state.sessions.get(t), v = e.target.value;
      if (s && s.notes !== v) setTimeout(() => saveSession(t, { notes: v }));
      else setTimeout(render);
    }
  });

  // ---------- boot ----------
  try { const tab = localStorage.getItem("yeti-tab"); if (tab) state.tab = tab; } catch (e) {}
  if (location.hash === "#history") { state.tab = "history"; history.replaceState(null, "", "/"); }

  (async () => {
    try {
      const r = await fetch("/api/me", { credentials: "same-origin" });
      if (r.ok) state.me = (await r.json()).name;
      else if (r.status !== 401) {
        const body = await r.json().catch(() => ({}));
        appEl.innerHTML = `<div class="card empty">${esc(body.error || "The server isn't working right now. Try again in a minute.")}</div>`;
        return;
      }
    } catch (e) {
      appEl.innerHTML = `<div class="card empty">Can't reach the server. Check your connection and reload.</div>`;
      return;
    }
    state.authChecked = true;
    render();
    if (state.me) { load(); initPush(); }
  })();
  const refresh = () => { if (state.me && document.visibilityState === "visible") load(); };
  setInterval(refresh, 15000);
  document.addEventListener("visibilitychange", refresh);
})();
</script>
</body>
</html>
