<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yeti Alone-Time Training</title>
<meta name="theme-color" content="#1e1b19">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yeti">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one phone column. A dark "hero" card for today's numbers, then a timeline of reps; bottom tab bar with icons.
   Palette from Yeti himself: phantom black and tan, white chest spot, on the icon's cool blue-grey. */
:root {
  --bg: #e4e9ee;
  --surface: #ffffff;
  --surface-2: #f2f5f7;
  --line: #d6dde3;
  --ink: #1e1b19;
  --muted: #5e6770;
  --accent: #ad5d1c;
  --accent-ink: #ffffff;
  --accent-soft: #f5e5d5;
  --hero: #1e1b19;
  --hero-ink: #f6f2ed;
  --hero-muted: #b4aaa0;
  --hero-line: #3b3531;
  --tan: #d68a45;
  --calm: #23845a;
  --calm-soft: #dcf1e6;
  --mild: #a8700a;
  --mild-soft: #f8ecd2;
  --upset: #c23c2c;
  --upset-soft: #f8dfdb;
  --overlay: #1a1715;
  --overlay-ink: #f6f2ed;
  --shadow: 0 1px 2px rgba(30, 27, 25, 0.06), 0 6px 20px rgba(30, 27, 25, 0.06);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111214; --surface: #1b1d20; --surface-2: #24272b; --line: #32363b;
    --ink: #ede9e4; --muted: #9ba2a9; --accent: #e39a57; --accent-ink: #1e1205; --accent-soft: #3a2a1c;
    --hero: #272220; --hero-ink: #f6f2ed; --hero-muted: #b4aaa0; --hero-line: #3f3834; --tan: #e39a57;
    --calm: #5ccf97; --calm-soft: #17352a; --mild: #e8b44c; --mild-soft: #3a2f17;
    --upset: #ff8a7a; --upset-soft: #432420; --overlay: #0d0c0b; --overlay-ink: #f6f2ed;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111214; --surface: #1b1d20; --surface-2: #24272b; --line: #32363b;
  --ink: #ede9e4; --muted: #9ba2a9; --accent: #e39a57; --accent-ink: #1e1205; --accent-soft: #3a2a1c;
  --hero: #272220; --hero-ink: #f6f2ed; --hero-muted: #b4aaa0; --hero-line: #3f3834; --tan: #e39a57;
  --calm: #5ccf97; --calm-soft: #17352a; --mild: #e8b44c; --mild-soft: #3a2f17;
  --upset: #ff8a7a; --upset-soft: #432420; --overlay: #0d0c0b; --overlay-ink: #f6f2ed;
  --shadow: none;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  margin: 0;
  padding-block: calc(20px + env(safe-area-inset-top, 0px)) calc(96px + env(safe-area-inset-bottom, 0px));
}
.app { max-width: 560px; margin: 0 auto; display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
h2 { font-size: 1.15rem; font-weight: 700; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
/* iPhones zoom into any text field under 16px when it's tapped */
input, select, textarea { font-size: 16px !important; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.notice { background: var(--mild-soft); color: var(--ink); border-radius: var(--r); padding: 10px 14px; font-size: 0.9rem; }


.card { background: var(--surface); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; box-shadow: var(--shadow); }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.hint-toggle { background: none; border: 0; color: var(--accent); font-weight: 700; font-size: 0.85rem; padding: 4px 0; }

.hero { background: var(--hero); color: var(--hero-ink); border-radius: 24px; padding: 18px 18px 16px; display: grid; gap: 16px; }
.hero-top { display: flex; align-items: center; gap: 12px; }
.logo { width: 44px; height: 44px; border-radius: 12px; flex: none; }
.hero .eyebrow { color: var(--hero-muted); }
.hero h1 { font-size: 1.55rem; }
.hero-main { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.hero-big { display: grid; gap: 2px; }
.hero-big b { font-family: var(--font-display); font-size: 3.2rem; line-height: 1; font-weight: 800; letter-spacing: -0.03em; color: var(--tan); font-variant-numeric: tabular-nums; }
.hero-big span.sub { color: var(--hero-muted); font-size: 0.9rem; }
.hero-stats { display: flex; gap: 18px; }
.hero-stats div { display: grid; gap: 1px; }
.hero-stats span { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--hero-muted); font-weight: 700; }
.hero-stats b { font-family: var(--font-display); font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.segments { display: flex; gap: 4px; }
.segments i { flex: 1; height: 6px; border-radius: 3px; background: var(--hero-line); }
.segments i.calm { background: var(--calm); }
.segments i.mild { background: var(--mild); }
.segments i.upset { background: var(--upset); }
.segments i.skip { background: var(--hero-muted); opacity: 0.4; }
.why { font-size: 0.92rem; color: var(--muted); }

.cues { display: grid; gap: 8px; }
.check { display: flex; gap: 10px; align-items: center; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.cue-list { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 0.85rem; }

.reps { list-style: none; margin: 0; padding: 0; display: grid; position: relative; }
.reps::before { content: ""; position: absolute; left: 15px; top: 18px; bottom: 18px; width: 2px; background: var(--line); }
.rep { display: grid; grid-template-columns: 32px 1fr auto; align-items: center; gap: 12px; padding: 8px 0; position: relative; }
.rep .idx { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 2px solid var(--line); font-family: var(--font-display); font-size: 0.85rem; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; position: relative; }
.rep.r-calm .idx { background: var(--calm); border-color: var(--calm); color: var(--surface); }
.rep.r-mild .idx { background: var(--mild); border-color: var(--mild); color: var(--surface); }
.rep.r-upset .idx { background: var(--upset); border-color: var(--upset); color: var(--surface); }
.rep.r-skip .idx { border-style: dashed; }
.rep.next .idx { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.rep .dur { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.rep .len { height: 4px; border-radius: 2px; background: var(--surface-2); margin-top: 4px; overflow: hidden; max-width: 160px; }
.rep .len i { display: block; height: 100%; background: var(--line); border-radius: 2px; }
.rep.next .len i, .rep.top .len i { background: var(--tan); }
.rep .sub { font-size: 0.82rem; color: var(--muted); margin-top: 3px; }
.rep.top .dur::after { content: "longest"; font-family: var(--font-body); font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); margin-left: 8px; vertical-align: middle; }
.pill-btn { background: none; border: 0; padding: 0; display: inline-flex; align-items: center; gap: 4px; }
.edit-mark { color: var(--muted); font-size: 0.85rem; }
.pill { border-radius: 999px; padding: 3px 10px; font-size: 0.8rem; font-weight: 700; white-space: nowrap; }
.pill.calm { background: var(--calm-soft); color: var(--calm); }
.pill.mild { background: var(--mild-soft); color: var(--mild); }
.pill.upset { background: var(--upset-soft); color: var(--upset); }
.pill.skip { background: var(--surface-2); color: var(--muted); }

.btn { border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 700; background: var(--accent); color: var(--accent-ink); }
.btn.sm { padding: 8px 14px; font-size: 0.9rem; }
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--line); }
.btn.quiet { background: var(--surface-2); color: var(--ink); }
.btn:disabled { opacity: 0.45; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.banner { border-radius: var(--r); padding: 14px 16px; display: grid; gap: 6px; }
.banner.upset { background: var(--upset-soft); }
.banner.calm { background: var(--calm-soft); }
.banner.rest { background: var(--accent-soft); }

textarea, input[type="text"], input[type="number"], select {
  width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
textarea { min-height: 72px; resize: vertical; }
label.field { display: grid; gap: 6px; font-weight: 700; font-size: 0.92rem; }
label.field span.muted { font-weight: 400; }

/* History */
.chart-wrap { overflow-x: auto; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.82rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.session { background: var(--surface); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 8px; }
.session-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.dots { display: flex; flex-wrap: wrap; gap: 4px; }
.dot { font-size: 0.75rem; border-radius: 6px; padding: 2px 6px; font-weight: 700; font-variant-numeric: tabular-nums; }
.dot.calm { background: var(--calm-soft); color: var(--calm); }
.dot.mild { background: var(--mild-soft); color: var(--mild); }
.dot.upset { background: var(--upset-soft); color: var(--upset); }
.dot.none { background: var(--surface-2); color: var(--muted); }
.who { display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--muted); }
.who img { width: 20px; height: 20px; border-radius: 50%; }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); }

/* Setup */
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
.presets button { border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 8px 12px; font-weight: 700; }
.presets button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

/* Tabs */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabs nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabs button { background: none; border: 0; padding: 8px 4px 10px; font-weight: 700; font-size: 0.78rem; color: var(--muted); display: grid; justify-items: center; gap: 3px; }
.tabs button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.tabs button[aria-current="page"] { color: var(--accent); }

/* Timer overlay */
.overlay {
  position: fixed; inset: 0; z-index: 20; overflow-y: auto; background: var(--overlay); color: var(--overlay-ink);
  display: grid; align-content: center; justify-items: center; gap: 22px; text-align: center;
  padding: calc(24px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
}
.overlay .eyebrow { color: #b4aaa0; }
.ring { width: min(72vw, 300px); max-width: 100%; aspect-ratio: 1; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .clock { position: absolute; inset: 0; display: grid; place-content: center; gap: 4px; }
.ring .clock b { font-family: var(--font-display); font-size: clamp(2.6rem, 14vw, 4.2rem); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.overlay .btn.quiet { background: #36302c; color: var(--overlay-ink); }
.outcome { width: min(100%, 420px); display: grid; gap: 10px; text-align: left; }
.outcome button.res { border: 2px solid transparent; border-radius: 14px; padding: 14px 16px; text-align: left; display: grid; gap: 2px; background: #29241f; color: var(--overlay-ink); }
.outcome button.res b { font-family: var(--font-display); font-size: 1.15rem; }
.outcome button.res span { font-size: 0.85rem; color: #b4aaa0; }
.outcome button.res.calm b { color: #5ccf97; }
.outcome button.res.mild b { color: #e8b44c; }
.outcome button.res.upset b { color: #ff8a7a; }
.outcome button.res[aria-pressed="true"] { border-color: currentColor; }
#tag-box { display: grid; gap: 8px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag { border: 1.5px solid #3f3834; background: #29241f; color: var(--overlay-ink); border-radius: 999px; padding: 7px 12px; font-size: 0.88rem; font-weight: 700; }
.tag[aria-pressed="true"] { background: #e39a57; border-color: #e39a57; color: #1e1205; }
.tag.add { border-style: dashed; color: #b4aaa0; }
.tag.calm { color: #5ccf97; } .tag.mild { color: #e8b44c; } .tag.upset { color: #ff8a7a; }
#moment-box { text-align: left; }
.outcome input, .outcome select { background: #29241f; border-color: #3f3834; color: var(--overlay-ink); color-scheme: dark; }
.stages { display: grid; gap: 8px; }
.stages button { text-align: left; border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; }
.stages button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.stages b { font-family: var(--font-display); font-size: 1.05rem; }
.stages span { font-size: 0.85rem; color: var(--muted); }
.stage-tag { display: inline-block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 2px 7px; }
.insight { display: grid; grid-template-columns: 6.5rem 1fr 3.2rem; align-items: center; gap: 10px; font-size: 0.9rem; }
.insight .track { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; display: flex; }
.insight .track i { display: block; height: 100%; }
.insight b { font-variant-numeric: tabular-nums; text-align: right; }
.download { color: var(--accent); font-weight: 700; text-decoration: none; }
.remind-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.remind-row input[type="time"] { width: auto; min-width: 7.5rem; }
.steps { display: grid; gap: 10px; }
.step { background: var(--surface); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; box-shadow: var(--shadow); }
.step-head { display: flex; gap: 12px; align-items: center; }
.step-num { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; background: var(--surface-2); color: var(--muted); border: 2px solid var(--line); }
.step.skipped { opacity: 0.7; }
.step.done .step-num { background: var(--calm); border-color: var(--calm); color: var(--surface); }
.step.current { outline: 2px solid var(--accent); }
.step.current .step-num { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.step-head h2 { font-size: 1.05rem; }
.checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.checklist li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; }
.tick { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line); display: grid; place-items: center; font-size: 0.8rem; font-weight: 800; color: var(--surface); }
.tick.on { background: var(--calm); border-color: var(--calm); }
.checklist input { width: 22px; height: 22px; accent-color: var(--calm); margin: 0; }
.meter { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin-top: 4px; max-width: 220px; }
.meter i { display: block; height: 100%; background: var(--tan); }
.guide-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.guide-table td { border-top: 1px solid var(--line); padding: 8px 8px 8px 0; vertical-align: top; }
.guide-table td:first-child { font-weight: 700; white-space: nowrap; }
.periods { display: flex; flex-wrap: wrap; gap: 6px; }
.periods button { border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 0.88rem; }
.periods button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.report {
  --bg: #ffffff; --surface: #ffffff; --surface-2: #f2f5f7; --line: #dfe4e8; --ink: #1e1b19; --muted: #5e6770;
  --accent: #ad5d1c; --accent-soft: #f5e5d5; --tan: #c27632; --calm: #23845a; --calm-soft: #dcf1e6; --mild: #a8700a; --mild-soft: #f8ecd2;
  --upset: #c23c2c; --upset-soft: #f8dfdb; --shadow: none;
  background: #ffffff; color: #1e1b19; border-radius: 12px; padding: 22px; display: grid; gap: 18px; color-scheme: light;
}
.report .card { box-shadow: none; border: 1px solid var(--line); padding: 14px; }
.rp-head { display: flex; gap: 12px; align-items: center; border-bottom: 2px solid #1e1b19; padding-bottom: 14px; }
.rp-head img { width: 52px; height: 52px; border-radius: 12px; }
.rp-head h2 { font-size: 1.35rem; }
.rp-sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.rp-sum div { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 2px; min-width: 0; }
.rp-sum b { font-family: var(--font-display); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.rp-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
.rp-table th { text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); border-bottom: 1px solid var(--line); padding: 6px 6px 6px 0; }
.rp-table td { vertical-align: top; border-bottom: 1px solid var(--line); padding: 8px 6px 8px 0; }
.rp-table .dots { gap: 3px; }
.rp-scroll { overflow-x: auto; }
details summary { cursor: pointer; font-weight: 700; }
details[open] summary { margin-bottom: 8px; }
.prose { display: grid; gap: 8px; font-size: 0.93rem; }
.prose ul { margin: 0; padding-left: 1.2rem; display: grid; gap: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="card empty">Loading…</div>
</div>
<div class="tabs" id="tabs" hidden>
  <nav aria-label="Sections">
    <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Today</button>
    <button data-tab="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M6 15l4-5 3 3 5-7"/></svg>History</button>
    <button data-tab="guide"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>Guide</button>
    <button data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</button>
  </nav>
</div>
<div class="overlay" id="overlay" hidden></div>

<script type="module">
import * as P from "/plan.js";
(() => {
  const RESULTS = {
    calm: { label: "Calm", hint: "Relaxed, lying down, sniffing around, sleeping" },
    mild: { label: "Mild stress", hint: "Pacing, waiting at the door, a whine or two" },
    upset: { label: "Upset", hint: "Barking, howling, scratching, heavy panting" },
  };
  const state = {
    tab: "today", config: null, configLoaded: false, sessions: new Map(), absences: [],
    hints: (() => { try { return JSON.parse(localStorage.getItem("yeti-hints") || "{}"); } catch (e) { return {}; } })(),
    me: null, authChecked: false, offline: false, trainAnyway: false, ignoreUpset: false, timer: null, openHistory: new Set(),
  };

  // ---------- time helpers ----------
  const pad = n => String(n).padStart(2, "0");
  const dateStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayStr = () => dateStr(new Date());
  const niceDate = (s, opts = { weekday: "long", day: "numeric", month: "long" }) =>
    new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)).toLocaleDateString(undefined, opts);

  const clock = sec => { sec = Math.max(0, Math.ceil(sec)); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`; };
  function parseDur(txt) {
    txt = String(txt).trim().toLowerCase();
    if (!txt) return null;
    if (/^\d+(:\d{1,2}){1,2}$/.test(txt)) return txt.split(":").map(Number).reduce((a, b) => a * 60 + b, 0);
    let total = 0, matched = false;
    txt.replace(/(\d+(?:\.\d+)?)\s*(h|m|min|s|sec)?/g, (_, n, u) => { matched = true; total += +n * (u === "h" ? 3600 : u && u.startsWith("m") ? 60 : u ? 1 : 1); });
    return matched && total > 0 ? Math.round(total) : null;
  }
  const timeOf = ts => (ts ? new Date(ts).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }) : "");
  // Collapsible instructions: closed unless opened, and the choice sticks on this phone.
  function hint(key, label, body) {
    const open = !!state.hints[key];
    return `<button type="button" class="hint-toggle" data-act="toggle-hint" data-k="${key}" aria-expanded="${open}">${open ? "Hide" : label}</button>${open ? `<div class="small muted">${body}</div>` : ""}`;
  }

  // ---------- the training logic (see plan.js) ----------
  const { STAGES, REST_BETWEEN, fmt, roundDur, doneReps, sessionMode, buildPlan: planFor, pickCues } = P;
  const dog = () => P.dogName(state.config);
  const curMode = () => P.curMode(state.config);
  const getBase = mode => P.getBase(state.config, mode);
  const nextAfter = s => P.nextAfter(s, dog());
  const computeWorking = (mode = curMode()) => P.computeWorking(state.config, state.sessions, todayStr(), mode, state.absences);
  const buildPlan = (w, date, mode = curMode()) => planFor(state.config, w, date, mode);
  const restSuggested = () => P.restSuggested(state.config, state.sessions, todayStr());
  const weekCount = () => P.weekCount(state.sessions, todayStr());
  const bestCalmEver = mode => P.bestCalmEver(state.sessions, mode);

  // ---------- storage ----------
  class AuthError extends Error {}
  async function api(path, opts = {}) {
    const res = await fetch(path, { ...opts, headers: { "Content-Type": "application/json" }, credentials: "same-origin" });
    const body = await res.json().catch(() => ({}));
    if (res.status === 401 && path !== "/api/login") {
      state.me = null; render();
      throw new AuthError("Not logged in");
    }
    if (!res.ok) throw new Error(body.error || `Request failed (${res.status})`);
    return body;
  }

  let pending = 0, lastSnapshot = "";
  const writeChains = new Map();
  function queueWrite(key, fn, onDone) {
    pending++;
    const next = (writeChains.get(key) || Promise.resolve())
      .then(fn)
      .then(result => { if (onDone && writeChains.get(key) === next) onDone(result); })
      .catch(e => { console.error(e); toast(e instanceof AuthError ? "You were logged out. Log in again." : "Couldn't save just now. Check your connection and try again."); })
      .finally(() => { pending--; });
    writeChains.set(key, next);
    return next;
  }

  // Pull everything from the server. Skipped while a save is in flight so it can't undo it.
  async function load() {
    if (pending || state.timer) return;
    try {
      const data = await api("/api/state");
      state.offline = false;
      const snapshot = JSON.stringify(data);
      if (pending || (snapshot === lastSnapshot && state.configLoaded)) return;
      lastSnapshot = snapshot;
      state.config = data.config;
      state.sessions = new Map(data.sessions.map(x => [x.date, x]));
      state.absences = data.absences || [];
      state.configLoaded = true;
      render();
      refreshStalePlan();
    } catch (e) {
      if (!(e instanceof AuthError)) { state.offline = true; render(); }
    }
  }

  // Today's plan made before the plan shape changed (and not started yet) is rebuilt once.
  function refreshStalePlan() {
    const t = todayStr(), s = state.sessions.get(t);
    if (!s || (s.planVersion || 1) >= P.PLAN_VERSION || (s.reps || []).some(r => r.result)) return;
    saveSession(t, { plan: buildPlan(s.working, t, sessionMode(s)), planVersion: P.PLAN_VERSION });
  }

  function saveSession(date, patch, create = false) {
    const existing = state.sessions.get(date);
    state.sessions.set(date, { ...(existing || {}), ...patch, date });
    render();
    return queueWrite("s:" + date, () => api(`/api/sessions/${date}`, { method: "PATCH", body: JSON.stringify({ patch, create }) }),
      r => { if (r && r.session) { state.sessions.set(date, { ...r.session, reps: (state.sessions.get(date) || {}).reps || [] }); render(); } });
  }
  // Reps are saved one row each on the server, so two phones can't overwrite each other.
  function saveReps(date, newReps) {
    const s = state.sessions.get(date) || { date, reps: [] };
    const ids = new Set(newReps.map(r => r.i));
    state.sessions.set(date, { ...s, reps: (s.reps || []).filter(r => !ids.has(r.i)).concat(newReps).sort((a, b) => a.i - b.i) });
    render();
    return queueWrite("s:" + date, () => api("/api/reps", { method: "POST", body: JSON.stringify({ date, reps: newReps }) }));
  }
  function deleteRep(date, i) {
    const s = state.sessions.get(date);
    if (s) state.sessions.set(date, { ...s, reps: (s.reps || []).filter(r => r.i !== i) });
    render();
    return queueWrite("s:" + date, () => api("/api/reps", { method: "DELETE", body: JSON.stringify({ date, i }) }));
  }
  function saveAbsence(a) {
    state.absences = state.absences.filter(x => x.id !== a.id).concat([a]).sort((x, y) => x.start - y.start);
    render();
    return queueWrite("abs:" + a.id, () => api("/api/absences", { method: "POST", body: JSON.stringify({ absence: a }) }));
  }
  function deleteAbsence(id) {
    state.absences = state.absences.filter(x => x.id !== id);
    render();
    return queueWrite("abs:" + id, () => api("/api/absences", { method: "DELETE", body: JSON.stringify({ id }) }));
  }
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  function ensureToday() {
    const t = todayStr();
    if (state.sessions.get(t)) return state.sessions.get(t);
    const mode = curMode();
    const { w, why } = computeWorking(mode);
    const s = { date: t, mode, setup: lastSetup(), working: w, why, plan: buildPlan(w, t, mode), planVersion: P.PLAN_VERSION, cues: pickCues(t, mode), cuesDone: false, reps: [], notes: "", createdAt: Date.now() };
    saveSession(t, s, true);
    return s;
  }
  // Point a stage at a new level, and rebuild today's plan if no reps are done yet.
  // Returns "now" when today's plan changed, "tomorrow" when it only applies from the next session.
  function setStage(mode, seconds) {
    const bases = { ...(state.config.bases || {}) };
    if (!bases.door && state.config.base) bases.door = state.config.base;
    if (seconds) bases[mode] = { seconds, setOn: todayStr(), setAt: Date.now() };
    saveConfig({ mode, bases });
    const t = todayStr(), s = state.sessions.get(t);
    if (!s) return "now";
    if (!doneReps(s).length) {
      const { w, why } = computeWorking(mode);
      saveSession(t, { mode, working: w, why, plan: buildPlan(w, t, mode), planVersion: P.PLAN_VERSION, cues: pickCues(t, mode), cuesDone: false });
      return "now";
    }
    // Reps already done today: keep those, and move the rest of today's reps to the new level.
    if (seconds && sessionMode(s) === mode) {
      const w = roundDur(seconds);
      const fresh = buildPlan(w, t, mode);
      const done = new Set((s.reps || []).filter(r => r.result).map(r => r.i));
      const len = Math.max(fresh.length, Math.max(-1, ...done) + 1);
      const plan = Array.from({ length: len }, (_, i) => (done.has(i) ? s.plan[i] : fresh[Math.min(i, fresh.length - 1)]));
      const pending = plan.map((_, i) => i).filter(i => !done.has(i));
      if (pending.length && !pending.some(i => plan[i] === w)) {
        const top = pending.reduce((a, i) => (plan[i] > plan[a] ? i : a), pending[0]);
        plan[top] = w; // keep the longest rep in what's left
      }
      saveSession(t, { working: w, why: `Level changed to ${fmt(w)} today.`, plan });
      return "now";
    }
    return "tomorrow";
  }
  function saveConfig(patch) {
    let tz = null;
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) {}
    state.config = { ...(state.config || {}), ...patch, ...(tz ? { tz } : {}) };
    render();
    return queueWrite("config", () => api("/api/config", { method: "PUT", body: JSON.stringify({ data: state.config }) }));
  }

  // ---------- rendering ----------
  const appEl = document.getElementById("app");
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const personName = name => (name && name === state.me ? "You" : name || "Someone");

  let toastTimer;
  function toast(msg) {
    let el = document.getElementById("toast");
    if (!el) { el = document.createElement("div"); el.id = "toast"; el.className = "notice"; el.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;max-width:min(92vw,480px)"; document.body.appendChild(el); }
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.hidden = true), 4200);
  }

  function render() {
    if (!state.authChecked) return;
    if (!state.me) { document.getElementById("tabs").hidden = true; appEl.innerHTML = loginView(); return bindLogin(); }
    if (!state.configLoaded) {
      document.getElementById("tabs").hidden = true;
      appEl.innerHTML = state.offline ? `<div class="card empty">Can't reach the server. Check your connection; it retries on its own.</div>` : `<div class="card empty">Loading…</div>`;
      return;
    }
    const typing = document.activeElement && appEl.contains(document.activeElement) && document.activeElement.matches("input[type=text], input[type=number], input[type=password], textarea");
    if (typing) return; // don't clobber what someone is typing
    document.getElementById("tabs").hidden = !state.config;
    document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === (state.tab === "report" ? "history" : state.tab) ? "page" : "false"));
    if (!state.config) { appEl.innerHTML = setupView(); return bindSetup(); }
    const view = state.tab === "guide" ? guideView() : state.tab === "report" ? reportView() : state.tab === "history" ? historyView() : state.tab === "settings" ? settingsView() : todayView();
    appEl.innerHTML = (state.offline ? `<div class="notice">Can't reach the server right now. Changes may not save until you're back online.</div>` : "") + view;
  }

  function loginView() {
    let lastName = "";
    try { lastName = localStorage.getItem("yeti-name") || ""; } catch (e) {}
    return `
      <div class="top"><div class="hero-top"><img class="logo" src="/icon-192.png" alt="" style="width:56px;height:56px;border-radius:16px"><div><p class="eyebrow">Separation training</p><h1>Log in</h1></div></div></div>
      <form class="card" id="login-form">
        <label class="field">Your name<span class="muted small">Shows in the history next to the reps you do.</span><input type="text" id="login-name" value="${esc(lastName)}" autocomplete="nickname" maxlength="40" required></label>
        <label class="field">Household password<input type="password" id="login-pass" autocomplete="current-password" required></label>
        <p class="small" id="login-err" style="color:var(--upset)" hidden></p>
        <button class="btn" type="submit">Log in</button>
      </form>`;
  }
  function bindLogin() {
    document.getElementById("login-form").onsubmit = async e => {
      e.preventDefault();
      const name = document.getElementById("login-name").value.trim();
      const password = document.getElementById("login-pass").value;
      const err = document.getElementById("login-err");
      try {
        const r = await api("/api/login", { method: "POST", body: JSON.stringify({ name, password }) });
        try { localStorage.setItem("yeti-name", r.name); } catch (e2) {}
        state.me = r.name; document.activeElement && document.activeElement.blur();
        render(); load(); initPush();
      } catch (ex) { err.textContent = ex.message; err.hidden = false; }
    };
  }

  function setupView() {
    return `
      <div class="top"><div><p class="eyebrow">Separation training</p><h1>Let's set up the plan</h1></div></div>
      <div class="card">
        <label class="field">Dog's name<input type="text" id="setup-name" value="Yeti" autocomplete="off"></label>
        <div class="field" style="display:grid;gap:8px">
          <b class="small">How long can your dog stay calm without you right now?</b>
          <p class="small muted">Pick the time you're confident about, not the best day ever. If you don't know, start short. The plan adjusts after every session.</p>
          <div class="presets" id="presets">
            ${[5, 15, 30, 60, 120, 300, 600].map(s => `<button type="button" data-s="${s}" aria-pressed="${s === 30}">${fmt(s)}</button>`).join("")}
          </div>
          <input type="text" id="setup-dur" placeholder="Or type a time, e.g. 1:30 or 4m" autocomplete="off">
        </div>
        <div class="field" style="display:grid;gap:8px">
          <b class="small">Where do you start?</b>
          <div class="stages" id="setup-stage">
            ${Object.entries(STAGES).map(([k, st]) => `<button type="button" data-mode="${k}" aria-pressed="${k === "gate"}"><b>${st.label}</b><span>${esc(st.desc)}</span></button>`).join("")}
          </div>
        </div>
        <button class="btn" id="setup-go">Make today's plan</button>
      </div>`;
  }
  function bindSetup() {
    let chosen = 30, mode = "gate";
    document.querySelectorAll("#setup-stage button").forEach(b => (b.onclick = () => {
      mode = b.dataset.mode;
      document.querySelectorAll("#setup-stage button").forEach(x => x.setAttribute("aria-pressed", x === b));
    }));
    document.querySelectorAll("#presets button").forEach(b => (b.onclick = () => {
      chosen = +b.dataset.s; document.getElementById("setup-dur").value = "";
      document.querySelectorAll("#presets button").forEach(x => x.setAttribute("aria-pressed", x === b));
    }));
    document.getElementById("setup-go").onclick = () => {
      const typed = parseDur(document.getElementById("setup-dur").value);
      const seconds = typed || chosen;
      saveConfig({ dogName: document.getElementById("setup-name").value.trim() || "Yeti", mode, bases: { [mode]: { seconds, setOn: todayStr(), setAt: Date.now() } }, perWeek: 5, capMin: 30 });
    };
  }

  function todayView() {
    const t = todayStr();
    const s = state.sessions.get(t);
    const mode = s ? sessionMode(s) : curMode();
    const computed = s ? null : computeWorking(mode);
    const w = s ? s.working : computed.w;
    const plan = s ? s.plan : buildPlan(w, t, mode);
    const cues = s ? s.cues : pickCues(t, mode);
    const reps = (s && s.reps) || [];
    const repFor = i => reps.find(r => r.i === i);
    const nextIdx = plan.findIndex((_, i) => !repFor(i));
    const upset = reps.some(r => r.result === "upset");
    const allDone = nextIdx === -1;
    const estMin = Math.round((plan.reduce((a, b) => a + b, 0) + REST_BETWEEN * (plan.length - 1)) / 60);
    const rest = !s && restSuggested() && !state.trainAnyway;
    const maxTarget = Math.max(...plan);
    const topIdx = plan.indexOf(maxTarget);

    const guide = P.guideProgress(state.config, state.sessions);
    let banner = "";
    if (rest) {
      banner = `<div class="banner rest"><h2>Rest day suggested</h2><p class="small">${esc(dog())} has trained ${(state.config.perWeek || 5)} days in the last week. A day off helps the progress stick. Keep any time alone today shorter than ${fmt(w)}.</p><div class="row"><button class="btn sm ghost" data-act="train-anyway">Train anyway</button></div></div>`;
    } else if (upset && !allDone && !state.ignoreUpset) {
      banner = `<div class="banner upset"><h2>Stop here for today</h2><p class="small">${esc(dog())} got upset. End with something fun: a walk, a sniff game, a chew. Tomorrow's plan steps back automatically.</p><div class="row"><button class="btn sm quiet" data-act="end-session">End today's session</button><button class="btn sm ghost" data-act="ignore-upset">Keep going</button></div></div>`;
    } else if (guide.ready && !guide.last && !(s && doneReps(s).length)) {
      banner = `<div class="banner calm"><h2>Ready for the next step</h2><p class="small">${esc(dog())} has ticked off everything for "${esc(GUIDE_TEXT[guide.step].title)}". Have a look at the next step in the Guide.</p><div class="row"><button class="btn sm ghost" data-act="goto-guide">Open the Guide</button></div></div>`;
    } else if (!state.config.mode && !s) {
      banner = `<div class="banner rest"><h2>New: start behind a baby gate</h2><p class="small">If going out the front door is slow or noisy, start with ${esc(dog())} behind a gate while you go out of sight inside. Move to the door later.</p><div class="row"><button class="btn sm ghost" data-act="goto-settings">Choose a stage</button></div></div>`;
    } else if (allDone && s) {
      const n = nextAfter(s);
      banner = `<div class="banner ${upset ? "upset" : "calm"}"><h2>Done for today</h2><p class="small">Tomorrow's longest rep will be about <b class="num">${fmt(roundDur(Math.max(3, n.w)))}</b>. ${esc(n.why.replace("last session", "today").replace("last time", "today").replace("so today", "so tomorrow"))}</p></div>`;
    }

    const repRows = plan.map((target, i) => {
      const r = repFor(i);
      let right;
      if (r) right = `<button class="pill-btn" data-act="edit-rep" data-d="${t}" data-i="${i}" aria-label="Change rep ${i + 1}">${r.result === "skip" ? `<span class="pill skip">Skipped</span>` : `<span class="pill ${r.result}">${RESULTS[r.result].label}${r.actual && r.actual !== r.target ? ` · ${fmt(r.actual)}` : ""}</span>`}<span class="edit-mark" aria-hidden="true">✎</span></button>`;
      else if (i === nextIdx && !rest) right = `<button class="btn sm" data-act="start" data-i="${i}">Start</button>`;
      else right = `<span class="small muted">to do</span>`;
      const sub = r && r.by ? `<div class="sub">${esc(personName(r.by))}${r.at ? " · " + timeOf(r.at) : ""}${r.tags && r.tags.length ? " · " + esc(r.tags.join(", ")) : ""}${r.moments && r.moments.length ? " · during: " + esc(momentText(r)) : ""}${r.note ? " · " + esc(r.note) : ""}</div>` : i === nextIdx && !rest ? `<div class="sub">Up next</div>` : "";
      const cls = ["rep", r ? "r-" + r.result : "", i === nextIdx && !rest ? "next" : "", i === topIdx ? "top" : ""].filter(Boolean).join(" ");
      return `<li class="${cls}"><span class="idx">${i + 1}</span><div><div class="dur">${fmt(target)}</div><div class="len"><i style="width:${Math.max(4, (target / maxTarget) * 100).toFixed(0)}%"></i></div>${sub}</div>${right}</li>`;
    }).join("");

    return `
      <header class="hero">
        <div class="hero-top"><img class="logo" src="/icon-192.png" alt=""><div><p class="eyebrow">${esc(niceDate(t, { weekday: "short", day: "numeric", month: "short" }))} · ${esc(STAGES[mode].label)}</p><h1>${esc(dog())}'s plan today</h1></div></div>
        <div class="hero-main">
          <div class="hero-big"><span class="eyebrow">Longest rep</span><b>${fmt(w)}</b><span class="sub">${plan.length} reps · about ${estMin} min</span></div>
          <div class="hero-stats">
            <div><span>Best calm</span><b>${bestCalmEver(mode) ? fmt(bestCalmEver(mode)) : "–"}</b></div>
            <div><span>7 days</span><b>${weekCount()}/${state.config.perWeek || 5}</b></div>
          </div>
        </div>
        <div class="segments" aria-label="Reps done today">${plan.map((_, i) => { const r = repFor(i); return `<i class="${r ? r.result : ""}"></i>`; }).join("")}</div>
      </header>
      ${banner}
      <div class="card">
        <div><h2>Before you start</h2><p class="why">${esc(s ? s.why : computed.why)}</p></div>
        <div style="display:grid;gap:8px"><span class="eyebrow">Setup: how ${esc(dog())} is left</span>${setupButtons((s && s.setup) || lastSetup(), "set-setup")}</div>
        <div class="cues">
          <div>${hint("cues", "Why departure cues?", `Do each one 5 times, then sit back down. Don't leave. This takes the meaning out of the signals ${esc(dog())} watches for.`)}</div>
          <div class="cue-list">${cues.map(c => `<span class="chip">${esc(c)}</span>`).join("")}</div>
          <label class="check"><input type="checkbox" id="cues-done" ${s && s.cuesDone ? "checked" : ""} ${rest ? "disabled" : ""}> Cues done</label>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Reps</h2></div>
        <div>${hint("reps", "How to do the reps", `${mode === "gate"
          ? `Close the gate with ${esc(dog())} on the other side and go out of sight: another room, or round a corner. Come back when the timer ends.`
          : `Head out through both doors and tap "I'm out" once they're shut. The timer starts then. Come back when it ends.`} Come back early if ${esc(dog())} starts to stress. Between reps, sit calmly for 1–2 minutes until ${esc(dog())} settles.`)}</div>
        <ol class="reps">${repRows}</ol>
        ${!rest ? `<div class="row"><button class="btn sm ghost" data-act="add-rep">Add a rep</button><input type="text" id="extra-dur" placeholder="e.g. 45s" style="width:8rem" autocomplete="off"></div>
        <button class="hint-toggle" data-act="log-manual" style="justify-self:start">Did one without the timer? Log it here</button>` : ""}
      </div>
      <button class="btn ghost" data-act="log-absence" style="justify-self:start">Log time alone</button>
      ${s ? `<div class="card"><label class="field">Notes for today<textarea id="notes" placeholder="What you noticed: triggers, what helped, who was home">${esc(s.notes || "")}</textarea></label></div>` : ""}
    `;
  }

  function historyView() {
    const list = [...state.sessions.values()].filter(s => (s.reps || []).length).sort((a, b) => (a.date < b.date ? 1 : -1));
    const feed = list.map(s => ({ date: s.date, at: Infinity, html: sessionCard(s) }))
      .concat(state.absences.map(a => ({ date: a.date, at: a.start, html: absenceCard(a) })))
      .sort((x, y) => (x.date !== y.date ? (x.date < y.date ? 1 : -1) : y.at - x.at));
    if (!list.length && !state.absences.length) return `<div class="top"><div><p class="eyebrow">History</p><h1>Every session, both of you</h1></div></div><div class="card empty">No sessions yet. Finish a rep on the Today tab and it shows up here, with who trained and how ${esc(dog())} did.</div>`;
    return `
      <div class="top"><div><p class="eyebrow">History</p><h1>Every session, both of you</h1></div></div>
      ${weekCard()}
      <button class="btn ghost" data-act="open-report" style="justify-self:start">Report for behaviourist (PDF)</button>
      <div class="card">
        <div class="row" style="justify-content:space-between"><h2>Progress</h2><span class="stage-tag">${esc(STAGES[curMode()].label)}</span></div>
        ${list.some(s => sessionMode(s) === curMode()) ? chart(list.filter(s => sessionMode(s) === curMode()).reverse()) : `<p class="small muted">No sessions in this stage yet.</p>`}
        <div class="legend"><span><i style="background:var(--accent)"></i>Longest planned rep</span><span><i style="background:var(--calm)"></i>Longest calm rep</span><span><i style="background:var(--upset)"></i>Got upset</span></div>
      </div>
      ${insightsCard(list)}
      <div class="row" style="justify-content:space-between"><h2>Sessions</h2><button class="btn sm ghost" data-act="log-absence">Log time alone</button></div>
      ${feed.map(f => f.html).join("")}
      <p class="small muted" style="text-align:center"><a class="download" href="/api/export">Download all data (CSV)</a> · opens in Excel or Google Sheets</p>`;
  }

  // Calm share of reps by time of day and by person, from each rep's saved time.
  function insightsCard(list, realNames = false) {
    const reps = list.flatMap(s => doneReps(s).map(r => ({ ...r, date: s.date, setup: r.setup || s.setup })));
    if (!reps.length) return "";
    const part = ts => { const h = new Date(ts).getHours(); return h < 5 ? "Night" : h < 12 ? "Morning" : h < 17 ? "Afternoon" : h < 22 ? "Evening" : "Night"; };
    const group = (keyFn, order) => {
      const g = new Map();
      for (const r of reps) { const k = keyFn(r); if (!k) continue; const x = g.get(k) || { calm: 0, mild: 0, upset: 0, n: 0 }; x[r.result]++; x.n++; g.set(k, x); }
      return [...g.entries()].sort((a, b) => (order ? order.indexOf(a[0]) - order.indexOf(b[0]) : b[1].n - a[1].n));
    };
    const rows = entries => entries.map(([k, x]) => `<div class="insight"><span>${esc(k)} <span class="muted small">${x.n}</span></span>
      <div class="track" role="img" aria-label="${Math.round((x.calm / x.n) * 100)}% calm"><i style="width:${(x.calm / x.n) * 100}%;background:var(--calm)"></i><i style="width:${(x.mild / x.n) * 100}%;background:var(--mild)"></i><i style="width:${(x.upset / x.n) * 100}%;background:var(--upset)"></i></div>
      <b>${Math.round((x.calm / x.n) * 100)}%</b></div>`).join("");
    const byTime = group(r => r.at && part(r.at), ["Morning", "Afternoon", "Evening", "Night"]);
    const byWho = group(r => r.by && (realNames ? r.by : personName(r.by)));
    const bySetup = group(r => SETUPS[r.setup], Object.values(SETUPS));
    // Each tag, how often, coloured by the result it's usually logged with.
    const signs = tagCounts(reps).slice(0, 12).map(([t, n]) => {
      const by = { calm: 0, mild: 0, upset: 0 };
      for (const r of reps) if (repTags(r).includes(t)) by[r.result]++;
      return [t, n, Object.entries(by).sort((a, b) => b[1] - a[1])[0][0]];
    });
    return `<div class="card">
      <div class="card-head"><h2>What works best</h2><span class="small muted">% calm reps</span></div>
      <div class="eyebrow">Time of day</div>${rows(byTime)}
      ${byWho.length > 1 ? `<div class="eyebrow">Who trained</div>${rows(byWho)}` : ""}
      ${bySetup.length > 1 ? `<div class="eyebrow">By setup</div>${rows(bySetup)}` : ""}
      ${signs.length ? `<div class="eyebrow">Signs you've seen</div><div class="dots">${signs.map(([t, n, res]) => `<span class="dot ${res}">${esc(t)} ×${n}</span>`).join("")}</div>` : ""}
      ${reps.length < 20 ? `<p class="small muted">Only ${reps.length} reps so far. Give it a couple of weeks before reading much into this.</p>` : ""}
    </div>`;
  }

  // ---------- the step-by-step guide ----------
  // Copy for each step; the checks behind "ready to move on" are in plan.js (GUIDE, guideProgress).
  const GUIDE_TEXT = [
    {
      title: "Behind the gate",
      summary: d => `${d} stays behind the gate while you go out of sight inside the flat.`,
      todo: d => [
        `One session a day in the app, about 5 days a week. The reps can be long here, because ${d} is relaxed behind the gate.`,
        `Make the gate part of normal life: several times a day put ${d} behind it while you cook, shower or work in another room, from 2 minutes to an hour. Bed, water, sometimes a chew.`,
        `Practise the departure cues (keys, shoes, opening and closing the first door) until they get no reaction.`,
      ],
      checks: { calm: "Calm for 20 minutes behind the gate, with you out of sight", streak: "3 calm sessions in a row", cues: d => `Departure cues get no reaction: ${d} stays lying down` },
      next: d => `Start the front door, with ${d} still behind the gate. The door level starts again at 5 seconds.`,
    },
    {
      title: "Front door, behind the gate",
      summary: d => `You leave through both front doors; ${d} stays behind the gate.`,
      todo: d => [
        `Short reps again: the door stage starts at a few seconds and grows a little each session. Seconds turn into minutes over a few weeks.`,
        `Each rep: go out through both doors, tap "I'm out" once they're shut, come back calmly when it ends. 1–2 minutes of calm between reps.`,
        `Stop a rep at the first sign of stress. Don't wait for barking.`,
      ],
      checks: { calm: "Calm for 30 minutes with you out of the flat", streak: "3 calm sessions in a row", returns: d => `Calm when you come back: no frantic greeting` },
      next: (d, keepGate) => (keepGate ? `Move on to building longer absences, with ${d} still behind the gate.` : "Open the gate. This is harder, so the door level is halved to start with."),
    },
    {
      title: "Gate open or free in the flat",
      summary: d => `The way ${d} will really be left: gate open, or free in the flat.`,
      todo: d => [
        `Start with the gate open but still in the doorway, then take it away or let ${d} have the run of the flat.`,
        `Expect the level to dip at first. That's normal, and it comes back quickly.`,
        `Pick "Gate open" or "Free in the flat" as the setup on Today, so History can compare.`,
      ],
      checks: { calm: "Calm for 30 minutes, gate open or free", streak: "3 calm sessions in a row" },
      next: () => "Move on to building longer absences.",
    },
    {
      title: "Longer absences",
      summary: d => `Building up to real-life absences: an hour, then several.`,
      todo: d => [
        `Keep one session a day, now with longer reps. Above an hour the steps are smaller.`,
        `Start replacing sitters and daycare with real absences, but only ones shorter than ${d}'s level.`,
        `Keep logging real absences with "Log time alone", so the plan and your behaviourist can see how they go.`,
      ],
      checks: { calm: "Calm for 2 hours" },
      next: () => "",
    },
  ];

  function guideView() {
    const g = P.guideProgress(state.config, state.sessions);
    const d = esc(dog());
    const keepGate = !!state.config.keepGate;
    const stepCard = (t, i) => {
      const skipped = keepGate && i === 2;
      const cls = skipped ? "skipped" : i < g.step ? "done" : i === g.step ? "current" : "";
      const head = `<div class="step-head"><span class="step-num">${skipped ? "–" : i < g.step ? "✓" : i + 1}</span><div><h2>${esc(t.title)}</h2><p class="small muted">${skipped ? `Skipped: you're keeping the gate. The room behind the gate is ${d}'s place.` : t.summary(d)}</p></div></div>`;
      const keepToggle = i === 2 ? `<label class="check small"><input type="checkbox" data-keep-gate ${keepGate ? "checked" : ""}> We'll keep the gate (skip this step)</label>` : "";
      if (i !== g.step) {
        return `<div class="step ${cls}">${head}${keepToggle}${i > g.step && !skipped ? `<button class="hint-toggle" data-act="guide-set" data-step="${i}" style="justify-self:start">I'm already on this step</button>` : ""}</div>`;
      }
      const items = g.checks.map(c => {
        const label = typeof t.checks[c.id] === "function" ? t.checks[c.id](d) : t.checks[c.id];
        if (c.manual) return `<li><input type="checkbox" id="guide-${c.id}" data-guide-check="${P.GUIDE[i].id}:${c.id}" ${c.done ? "checked" : ""}><label for="guide-${c.id}">${label}<br><span class="small muted">Tick this yourselves when it's true</span></label></li>`;
        const detail = c.id === "calm"
          ? `<span class="small muted">Best calm rep so far: ${c.best ? fmt(c.best) : "none yet"} of ${fmt(c.target)}</span><div class="meter"><i style="width:${Math.min(100, (c.best / c.target) * 100).toFixed(0)}%"></i></div>`
          : `<span class="small muted">${c.inRow} of ${c.of} so far</span>`;
        return `<li><span class="tick ${c.done ? "on" : ""}" aria-label="${c.done ? "Done" : "Not yet"}">${c.done ? "✓" : ""}</span><div>${label}<br>${detail}</div></li>`;
      }).join("");
      return `<div class="step current">${head}
        <div class="prose small"><ul>${t.todo(d).map(x => `<li>${x}</li>`).join("")}</ul></div>
        ${g.checks.length ? `<div style="display:grid;gap:8px"><span class="eyebrow">${g.last ? "Milestone" : "Ready to move on when"}</span><ul class="checklist">${items}</ul></div>` : ""}
        ${!g.last ? `<div style="display:grid;gap:6px">
          ${g.ready ? `<p class="small">All done. ${t.next(d, keepGate)}</p>` : `<p class="small muted">Next step: ${t.next(d, keepGate)}</p>`}
          <div class="row"><button class="btn ${g.ready ? "" : "ghost"} sm" data-act="guide-next">${g.ready ? "Move to the next step" : "Move on anyway"}</button></div>
        </div>` : ""}
        ${keepToggle}
      </div>`;
    };
    return `
      <div class="top"><div><p class="eyebrow">Guide</p><h1>Step by step</h1><p class="small muted">The usual under-threshold method, with numbers. Your behaviourist knows ${d} best: where their advice differs, follow them.</p></div></div>
      <div class="steps">${GUIDE_TEXT.map(stepCard).join("")}</div>
      <div class="card"><details><summary>Every session, step by step</summary>
        <table class="guide-table"><tbody>
          <tr><td>1. Before</td><td>Walk or sniff, toilet, then 10–15 minutes of calm at home.</td></tr>
          <tr><td>2. Cues</td><td>Do the two departure cues from Today 5 times each, without leaving.</td></tr>
          <tr><td>3. Reps</td><td>Follow the plan on Today. Watch ${d} on a camera if you can.</td></tr>
          <tr><td>4. Coming back</td><td>Calm and quiet. Let ${d} come to you.</td></tr>
          <tr><td>5. After</td><td>Something normal: a sniff walk, play, or just carry on with your day.</td></tr>
        </tbody></table>
        <p class="small muted">One session a day, about 5 days a week, 20–30 minutes at most.</p>
      </details></div>
      <div class="card"><details><summary>When to train</summary><div class="prose small"><ul>
        <li>When ${d} is awake and relaxed, about 15–30 minutes after a walk, toilet done.</li>
        <li>Don't wait for ${d} to fall asleep and then slip out. Waking up to find you gone teaches ${d} to keep watch. ${d} should see you go.</li>
        <li>Falling asleep during a rep is great: that's relaxing while you're away.</li>
        <li>Sleeping behind the gate at night: only if that's how you'll leave ${d} in real life and ${d} is relaxed there.</li>
      </ul></div></details></div>
      <div class="card"><details><summary>Stop a rep at the first sign of stress</summary><div class="prose small">
        <p>Come back in calmly as soon as you see any of these, and log the rep as mild stress:</p>
        <ul><li>Whining, even once or twice</li><li>Pacing, or waiting at the gate or door</li><li>Staring at the door or listening hard</li><li>Yawning or lip-licking</li><li>Dropping the chew or toy</li></ul>
        <p>Barking, howling, scratching or heavy panting mean upset: stop for the day.</p>
      </div></details></div>
      <div class="card"><details><summary>The two rules that matter most</summary><div class="prose small"><ul>
        <li><b>Outside training, don't leave ${d} alone longer than the current level.</b> Use a sitter, daycare, friends, or take ${d} along. One long panicky absence can undo weeks of work. If it happens, log it with "Log time alone".</li>
        <li><b>Go slow, even on great days.</b> Steady progress beats big jumps.</li>
      </ul></div></details></div>
      <div class="card"><details><summary>About chews</summary><div class="prose small">
        <p>A chew at the start of a session is fine. But if ${d} is only calm while chewing, ${d} isn't really relaxed yet. Now and then do the last rep without one, and use the "Busy with a chew" tag so you can see the difference.</p>
      </div></details></div>`;
  }

  // Moving to the next step also sets up the app for it.
  function guideNext() {
    const g = P.guideProgress(state.config, state.sessions);
    const step = P.nextGuideStep(state.config, g.step);
    if (step >= P.GUIDE.length) return;
    if (step === 1) {
      saveConfig({ lastSetup: "gate", guideStep: 1 });
      setStage("door", 5);
      const s = state.sessions.get(todayStr());
      if (s && !doneReps(s).length) saveSession(todayStr(), { setup: "gate" });
      toast(`Next step: front door, with ${dog()} behind the gate. Starting at 5 seconds.`);
    } else if (step === 2) {
      const w = computeWorking("door").w;
      saveConfig({ lastSetup: "gate-open", guideStep: 2 });
      setStage("door", roundDur(Math.max(3, w * 0.5)));
      const s = state.sessions.get(todayStr());
      if (s && !doneReps(s).length) saveSession(todayStr(), { setup: "gate-open" });
      toast(`Next step: gate open. The level starts at ${fmt(roundDur(Math.max(3, w * 0.5)))}.`);
    } else {
      saveConfig({ guideStep: step });
      toast(state.config.keepGate ? `Next step: longer absences, with ${dog()} behind the gate.` : "Next step: longer absences.");
    }
    window.scrollTo(0, 0);
  }

  // ---------- report for the behaviourist ----------
  function reportRange() {
    const r = state.report || (state.report = { period: "30" });
    const t = todayStr();
    const first = [...state.sessions.keys(), ...state.absences.map(a => a.date)].sort()[0] || t;
    if (r.period === "7") return { from: P.addDays(t, -6), to: t };
    if (r.period === "30") return { from: P.addDays(t, -29), to: t };
    if (r.period === "month") return { from: t.slice(0, 8) + "01", to: t };
    if (r.period === "all") return { from: first, to: t };
    return { from: r.from || P.addDays(t, -29), to: r.to || t };
  }

  function reportView() {
    const r = state.report || (state.report = { period: "30" });
    const { from, to } = reportRange();
    const list = [...state.sessions.values()].filter(s => s.date >= from && s.date <= to && doneReps(s).length).sort((a, b) => (a.date < b.date ? -1 : 1));
    const absences = state.absences.filter(a => a.date >= from && a.date <= to);
    const reps = list.flatMap(doneReps);
    const calm = reps.filter(x => x.result === "calm");
    const trainers = [...new Set(list.flatMap(s => (s.reps || []).map(x => x.by)).filter(Boolean))];
    const mode = curMode();
    const inStage = list.filter(s => sessionMode(s) === mode);
    const range = `${niceDate(from, { day: "numeric", month: "short", year: "numeric" })} – ${niceDate(to, { day: "numeric", month: "short", year: "numeric" })}`;
    const name = esc;
    const periods = [["7", "Last 7 days"], ["30", "Last 30 days"], ["month", "This month"], ["all", "Everything"], ["custom", "Custom"]];
    return `
      <div class="top"><div><button class="hint-toggle" data-act="back-history">← History</button><h1>Report</h1><p class="small muted">For your behaviourist: pick a period, then save it as a PDF or an image.</p></div></div>
      <div class="card">
        <div class="periods">${periods.map(([k, l]) => `<button type="button" data-act="report-period" data-p="${k}" aria-pressed="${r.period === k}">${l}</button>`).join("")}</div>
        ${r.period === "custom" ? `<div class="row"><label class="field" style="flex:1">From<input type="date" id="rp-from" value="${from}"></label><label class="field" style="flex:1">To<input type="date" id="rp-to" value="${to}"></label></div>` : ""}
        <div class="row"><button class="btn" data-act="report-pdf" ${state.exporting ? "disabled" : ""}>${state.exporting === "pdf" ? "Making PDF…" : "Save as PDF"}</button><button class="btn ghost" data-act="report-png" ${state.exporting ? "disabled" : ""}>${state.exporting === "png" ? "Making image…" : "Save as image"}</button></div>
      </div>
      <div class="report" id="report">
        <div class="rp-block rp-head"><img src="/icon-192.png" alt=""><div><p class="eyebrow">Separation anxiety training report</p><h2>${esc(dog())} · ${esc(range)}</h2><p class="small muted">Prepared ${esc(niceDate(todayStr(), { day: "numeric", month: "long", year: "numeric" }))}${trainers.length ? ` · Trained by ${trainers.map(name).join(" and ")}` : ""} · Current stage: ${esc(STAGES[mode].label.toLowerCase())}</p></div></div>
        <div class="rp-block rp-sum">
          <div><span class="eyebrow">Sessions</span><b>${list.length}</b></div>
          <div><span class="eyebrow">Reps</span><b>${reps.length}</b></div>
          <div><span class="eyebrow">Calm reps</span><b>${reps.length ? Math.round((calm.length / reps.length) * 100) + "%" : "–"}</b></div>
          <div><span class="eyebrow">Longest rep</span><b>${inStage.length ? `${fmt(inStage[0].working)} → ${fmt(inStage[inStage.length - 1].working)}` : "–"}</b></div>
          <div><span class="eyebrow">Best calm rep</span><b>${calm.length ? fmt(Math.max(...calm.map(x => x.actual || x.target))) : "–"}</b></div>
          <div><span class="eyebrow">Real absences</span><b>${absences.length}</b></div>
        </div>
        ${inStage.length ? `<div class="rp-block"><h3 style="margin-bottom:6px">Longest rep per session · ${esc(STAGES[mode].label.toLowerCase())}</h3>${chart(inStage)}
          <div class="legend"><span><i style="background:var(--accent)"></i>Longest planned rep</span><span><i style="background:var(--calm)"></i>Longest calm rep</span><span><i style="background:var(--upset)"></i>Got upset</span></div></div>` : ""}
        ${list.length ? `<div class="rp-block">${insightsCard(list.slice().reverse(), true)}</div>` : ""}
        ${list.length ? `<div class="rp-block"><h3>Sessions</h3></div>
        <div class="rp-scroll"><table class="rp-table"><thead class="rp-block"><tr><th>Date</th><th>Stage, setup</th><th>Longest</th><th>Reps (length, result)</th><th>Who</th></tr></thead><tbody>
          ${list.map(s => {
            const done = (s.reps || []).filter(x => x.result).sort((a, b) => a.i - b.i);
            const who = [...new Set(done.map(x => x.by).filter(Boolean))];
            const notes = [s.notes, ...done.filter(x => x.moments && x.moments.length).map(x => `rep ${x.i + 1} during: ${momentText(x)}`), ...done.filter(x => x.note).map(x => `rep ${x.i + 1}: ${x.note}`)].filter(Boolean).join(" · ");
            const signs = tagLine(done);
            return `<tr class="rp-block"><td>${esc(niceDate(s.date, { weekday: "short", day: "numeric", month: "short" }))}${done.some(x => x.at) ? `<br><span class="muted">${timeOf(Math.min(...done.filter(x => x.at).map(x => x.at)))}</span>` : ""}</td>
              <td>${sessionMode(s) === "gate" ? "Gate" : "Door"}${s.setup ? `<br><span class="muted">${esc(SETUPS[s.setup] || "")}</span>` : ""}</td><td>${fmt(s.working)}</td>
              <td><div class="dots">${done.map(x => `<span class="dot ${x.result === "skip" ? "none" : x.result}">${x.result === "skip" ? "skip" : fmt(x.actual || x.target)}</span>`).join("")}</div>${signs ? `<div style="margin-top:4px">${signs}</div>` : ""}${notes ? `<div class="muted" style="margin-top:4px">${esc(notes)}</div>` : ""}</td>
              <td>${who.map(name).join(", ")}</td></tr>`;
          }).join("")}
        </tbody></table></div>
        <p class="rp-block small muted">Colours: <span class="dot calm">calm</span> <span class="dot mild">mild stress</span> <span class="dot upset">upset</span>. The time shown is how long the rep really lasted: shorter than planned means someone went back in early, longer means they stayed out longer because the dog was relaxed.</p>` : `<p class="rp-block muted">No training sessions in this period.</p>`}
        ${absences.length ? `<div class="rp-block"><h3>Real absences (left alone outside training)</h3></div>
        <table class="rp-table"><thead class="rp-block"><tr><th>Date</th><th>Time</th><th>How long</th><th>How it went</th><th>Note</th></tr></thead><tbody>
          ${absences.map(a => `<tr class="rp-block"><td>${esc(niceDate(a.date, { weekday: "short", day: "numeric", month: "short" }))}</td><td>${timeOf(a.start)}</td><td>${fmt(a.seconds)}</td><td>${ABS_LABEL[a.result]}${a.tags && a.tags.length ? `<br><span class="muted">${esc(a.tags.join(", "))}</span>` : ""}</td><td>${esc(a.note || "")}</td></tr>`).join("")}
        </tbody></table>` : ""}
        <div class="rp-block small muted"><b style="color:var(--ink)">How the plan adjusts.</b> Each session has a longest rep, with shorter reps above and below it (3–4 longer reps behind the gate, 6–8 short ones at the front door). All calm through the longest rep: next session about +15%; if the whole session was calm and a rep ran longer than planned, the next level is at least 75% of that time. Mild stress: −15%, or the same level if it only happened in extra time. Upset: stop for the day, next session at 60% of where it went wrong. Breaks of 4–6, 7–13 and 14+ days restart at 85%, 70% and 50%. An upset real absence makes the next session 25% easier.</div>
      </div>`;
  }

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const el = document.createElement("script");
      el.src = src; el.onload = resolve;
      el.onerror = () => reject(new Error("Couldn't load the export tool. Check your connection and try again."));
      document.head.appendChild(el);
    });
  }
  function deliverFile(blob, filename) {
    const file = new File([blob], filename, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) return navigator.share({ files: [file], title: filename }).catch(() => {});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }

  // Render the report at a fixed paper width, then cut it into A4 pages between rows.
  async function exportReport(kind) {
    if (state.exporting) return;
    state.exporting = kind; render();
    try {
      if (!window.html2canvas) await loadScript("/vendor/html2canvas-1.4.1.min.js");
      if (kind === "pdf" && !window.jspdf) await loadScript("/vendor/jspdf-2.5.1.umd.min.js");
      const el = document.getElementById("report");
      const WIDTH = 720;
      let cuts = [];
      const opts = {
        backgroundColor: "#ffffff", windowWidth: WIDTH + 40,
        onclone: doc => {
          const r = doc.getElementById("report");
          r.style.width = WIDTH + "px"; r.style.borderRadius = "0";
          doc.querySelectorAll(".rp-scroll").forEach(x => (x.style.overflow = "visible"));
          const top = r.getBoundingClientRect().top;
          cuts = [...r.querySelectorAll(".rp-block")].map(b => b.getBoundingClientRect().bottom - top);
        },
      };
      // Keep the canvas inside phone memory limits on long reports.
      const tall = el.scrollHeight * (WIDTH / Math.max(1, el.clientWidth));
      opts.scale = Math.min(2, Math.sqrt(15e6 / (WIDTH * Math.max(tall, 1))));
      const canvas = await window.html2canvas(el, opts);
      const { from, to } = reportRange();
      const base = `${dog().toLowerCase()}-report-${from}-to-${to}`;
      let blob;
      if (kind === "png") {
        blob = await new Promise(res => canvas.toBlob(res, "image/png"));
        await deliverFile(blob, base + ".png");
      } else {
        const pdf = new window.jspdf.jsPDF({ unit: "pt", format: "a4" });
        const pageW = pdf.internal.pageSize.getWidth(), pageH = pdf.internal.pageSize.getHeight(), margin = 28;
        const k = (pageW - margin * 2) / canvas.width;           // canvas px -> pt
        const pxPerPage = (pageH - margin * 2) / k;
        const scaleCuts = cuts.map(c => c * (canvas.width / WIDTH)).sort((a, b) => a - b);
        let start = 0, first = true;
        while (start < canvas.height - 1) {
          const limit = start + pxPerPage;
          const fit = scaleCuts.filter(c => c > start + 40 && c <= limit);
          // If only a sliver would spill onto a new page, shrink this last page slightly instead.
          const end = canvas.height - start <= pxPerPage * 1.15 ? canvas.height : fit.length ? fit[fit.length - 1] : limit;
          const slice = document.createElement("canvas");
          slice.width = canvas.width; slice.height = Math.ceil(end - start);
          const ctx = slice.getContext("2d");
          ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, slice.width, slice.height);
          ctx.drawImage(canvas, 0, start, canvas.width, slice.height, 0, 0, canvas.width, slice.height);
          if (!first) pdf.addPage();
          const fitK = Math.min(k, (pageH - margin * 2) / slice.height);
          pdf.addImage(slice.toDataURL("image/jpeg", 0.92), "JPEG", margin, margin, canvas.width * fitK, slice.height * fitK);
          first = false; start = end;
        }
        blob = pdf.output("blob");
        await deliverFile(blob, base + ".pdf");
      }
    } catch (e) {
      console.error(e); toast(e.message || "Couldn't make the file. Try again.");
    }
    state.exporting = null; render();
  }

  function chart(asc) {
    const W = 560, H = 200, L = 52, R = 12, T = 12, B = 26;
    const pts = asc.map(s => {
      const done = doneReps(s);
      const calm = done.filter(r => r.result === "calm");
      return { date: s.date, w: s.working, best: calm.length ? Math.max(...calm.map(r => r.actual || r.target)) : null, upset: done.some(r => r.result === "upset") };
    });
    const max = Math.max(10, ...pts.map(p => Math.max(p.w, p.best || 0))) * 1.1;
    const x = i => (pts.length === 1 ? L + (W - L - R) / 2 : L + (i * (W - L - R)) / (pts.length - 1));
    const y = v => T + (H - T - B) * (1 - v / max);
    const ticks = [0, max / 2, max].map(v => roundDur(v));
    const line = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.w).toFixed(1)}`).join(" ");
    const area = `${line} L${x(pts.length - 1).toFixed(1)},${y(0)} L${x(0).toFixed(1)},${y(0)} Z`;
    const labelIdx = pts.length <= 2 ? pts.map((_, i) => i) : [0, Math.floor((pts.length - 1) / 2), pts.length - 1];
    return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Longest rep per session over time">
      ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`).join("")}
      <path d="${area}" fill="var(--accent-soft)" stroke="none"/>
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
      ${pts.map((p, i) => p.best != null ? `<circle cx="${x(i)}" cy="${y(p.best)}" r="4" fill="var(--calm)"/>` : "").join("")}
      ${pts.map((p, i) => p.upset ? `<circle cx="${x(i)}" cy="${y(p.w)}" r="5" fill="var(--surface)" stroke="var(--upset)" stroke-width="2.5"/>` : "").join("")}
      <circle cx="${x(pts.length - 1)}" cy="${y(pts[pts.length - 1].w)}" r="5" fill="var(--accent)"/>
      ${[...new Set(labelIdx)].map(i => `<text x="${x(i)}" y="${H - 6}" text-anchor="${pts.length > 1 && i === 0 ? "start" : pts.length > 1 && i === pts.length - 1 ? "end" : "middle"}">${esc(niceDate(pts[i].date, { day: "numeric", month: "short" }))}</text>`).join("")}
    </svg></div>`;
  }

  // ---------- reminders (web push) ----------
  const push = { supported: "serviceWorker" in navigator && "PushManager" in window && "Notification" in window, reg: null, sub: null, prefs: null, error: "", busy: false, ready: false };
  const keyBytes = b64 => { const s = atob((b64 + "=".repeat((4 - (b64.length % 4)) % 4)).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(s, c => c.charCodeAt(0)); };
  // Remembered per phone when someone turns reminders off on purpose, so the app doesn't turn them back on.
  const pushOptedOut = () => { try { return localStorage.getItem("yeti-push-off") === "1"; } catch (e) { return false; } };
  const setPushOptedOut = v => { try { v ? localStorage.setItem("yeti-push-off", "1") : localStorage.removeItem("yeti-push-off"); } catch (e) {} };

  // Every time the app opens, check this phone's reminders and repair them: phones sometimes drop or
  // replace their push registration, and the server can't reach them until the app registers again.
  async function initPush() {
    if (!push.supported) { push.ready = true; return; }
    try {
      push.reg = await navigator.serviceWorker.register("/sw.js");
      push.sub = await push.reg.pushManager.getSubscription();
      if (Notification.permission === "granted" && !pushOptedOut()) {
        if (!push.sub) {
          const { publicKey } = await api("/api/push");
          push.sub = await push.reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(publicKey) });
        }
        const r = await api("/api/push", { method: "POST", body: JSON.stringify({ subscription: push.sub.toJSON(), refresh: true, prefs: { tz: phoneTz() } }) });
        push.prefs = r.prefs; push.scheduled = r.scheduled; push.customTimes = !!r.customTimes;
      } else if (push.sub) {
        const r = await api(`/api/push?endpoint=${encodeURIComponent(push.sub.endpoint)}`);
        push.prefs = r.subscribed ? r.prefs : null; push.scheduled = r.scheduled; push.customTimes = !!r.customTimes;
      }
    } catch (e) { console.error(e); }
    push.ready = true;
    if (state.tab === "settings") render();
  }
  async function pushAction(fn) {
    if (push.busy) return;
    push.busy = true; push.error = ""; render();
    try { await fn(); } catch (e) { push.error = e.message || "Something went wrong."; }
    push.busy = false; render();
  }
  const turnOnPush = () => pushAction(async () => {
    setPushOptedOut(false);
    const perm = await Notification.requestPermission();
    if (perm !== "granted") throw new Error("Notifications are blocked for this app. Allow them in your phone's settings, then try again.");
    const { publicKey } = await api("/api/push");
    push.reg = push.reg || await navigator.serviceWorker.register("/sw.js");
    push.sub = (await push.reg.pushManager.getSubscription()) || await push.reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(publicKey) });
    const r = await api("/api/push", { method: "POST", body: JSON.stringify({ subscription: push.sub.toJSON(), prefs: { morning: true, evening: true, weekly: true, tz: phoneTz() } }) });
    push.prefs = r.prefs; push.scheduled = r.scheduled; push.customTimes = !!r.customTimes;
    await api("/api/push", { method: "POST", body: JSON.stringify({ test: true, endpoint: push.sub.endpoint }) });
    toast("Reminders are on. A test notification is on its way.");
  });
  const phoneTz = () => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) { return undefined; } };
  const savePushPrefs = prefs => pushAction(async () => {
    push.prefs = { ...push.prefs, ...prefs }; // show the new choice while it saves
    const r = await api("/api/push", { method: "POST", body: JSON.stringify({ subscription: push.sub.toJSON(), prefs: { ...prefs, tz: phoneTz() } }) });
    push.prefs = r.prefs; push.scheduled = r.scheduled;
    push.customTimes = !!r.customTimes;
  });
  const testPush = () => pushAction(async () => {
    await api("/api/push", { method: "POST", body: JSON.stringify({ test: true, endpoint: push.sub.endpoint }) });
    toast("Test sent. It should arrive in a few seconds.");
  });
  const turnOffPush = () => pushAction(async () => {
    await api("/api/push", { method: "DELETE", body: JSON.stringify({ endpoint: push.sub.endpoint }) });
    await push.sub.unsubscribe().catch(() => {});
    push.sub = null; push.prefs = null; push.scheduled = null;
    setPushOptedOut(true);
    toast("Reminders are off on this phone.");
  });

  function reminderStatus() {

      return `${day} ${timeOf(ms)}`;
    };
    const next = ["morning", "evening"].filter(k => sc[k] && sc[k].at > Date.now()).sort((a, b) => sc[a].at - sc[b].at);
    const lines = [];
    if (next.length) lines.push(`Next: ${next.map(k => `${k} ${when(sc[k].at)}`).join(", ")}.`);
    else if (push.customTimes) lines.push("Next reminders are booked tonight.");

    return lines.length ? `<p class="small muted">${esc(lines.join(" "))}</p>` : "";

    </div>`;
