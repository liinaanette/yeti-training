  // ---------- reminders (web push) ----------
  const push = { supported: "serviceWorker" in navigator && "PushManager" in window && "Notification" in window, reg: null, sub: null, prefs: null, error: "", busy: false, ready: false };
  const keyBytes = b64 => { const s = atob((b64 + "=".repeat((4 - (b64.length % 4)) % 4)).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(s, c => c.charCodeAt(0)); };
  async function initPush() {
    if (!push.supported) { push.ready = true; return; }
    try {
      push.reg = await navigator.serviceWorker.register("/sw.js");
      push.sub = await push.reg.pushManager.getSubscription();
      if (push.sub) {
        const r = await api(`/api/push?endpoint=${encodeURIComponent(push.sub.endpoint)}`);
        push.prefs = r.subscribed ? r.prefs : null;
      }
    } catch (e) { push.error = e.message; }
    push.ready = true;
    if (state.tab === "settings") render();
  }
  async function pushAction(fn) {
    if (push.busy) return;
    push.busy = true; push.error = ""; render();
    try { await fn(); } catch (e) { push.error = e.message || "Something went wrong."; }
    push.busy = false; render();
  }
  const turnOnPush = () => pushAction(async () => {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") throw new Error("Notifications are blocked for this app. Allow them in your phone's settings, then try again.");
    const { publicKey } = await api("/api/push");
    push.reg = push.reg || await navigator.serviceWorker.register("/sw.js");
    push.sub = (await push.reg.pushManager.getSubscription()) || await push.reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(publicKey) });
    const r = await api("/api/push", { method: "POST", body: JSON.stringify({ subscription: push.sub.toJSON(), prefs: { morning: true, evening: true, weekly: true } }) });
    push.prefs = r.prefs;
    await api("/api/push", { method: "POST", body: JSON.stringify({ test: true, endpoint: push.sub.endpoint }) });
    toast("Reminders are on. A test notification is on its way.");
  });
  const savePushPrefs = prefs => pushAction(async () => {
    const r = await api("/api/push", { method: "POST", body: JSON.stringify({ subscription: push.sub.toJSON(), prefs }) });
    push.prefs = r.prefs;
  });
  const testPush = () => pushAction(async () => {
    await api("/api/push", { method: "POST", body: JSON.stringify({ test: true, endpoint: push.sub.endpoint }) });
    toast("Test sent. It should arrive in a few seconds.");
  });
  const turnOffPush = () => pushAction(async () => {
    await api("/api/push", { method: "DELETE", body: JSON.stringify({ endpoint: push.sub.endpoint }) });
    await push.sub.unsubscribe().catch(() => {});
    push.sub = null; push.prefs = null;
    toast("Reminders are off on this phone.");
  });

  function remindersCard() {
    const iosNotInstalled = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.matchMedia("(display-mode: standalone)").matches;
    let inner;
    if (!push.supported || iosNotInstalled) {
      inner = `<p class="small muted">${iosNotInstalled
        ? "On iPhone, reminders only work from the home screen app. In Safari tap Share, then Add to Home Screen, then open Yeti from there."
        : "This browser can't show notifications. Try Chrome on Android, or the home screen app on iPhone."}</p>`;
    } else if (!push.ready) {
      inner = `<p class="small muted">Checking this phone…</p>`;
    } else if (push.sub && push.prefs) {
      inner = `
        <label class="check"><input type="checkbox" id="push-morning" ${push.prefs.morning ? "checked" : ""} ${push.busy ? "disabled" : ""}> Morning: today's plan</label>
        <label class="check"><input type="checkbox" id="push-evening" ${push.prefs.evening ? "checked" : ""} ${push.busy ? "disabled" : ""}> Evening: nudge if nobody has trained yet</label>
        <label class="check"><input type="checkbox" id="push-weekly" ${push.prefs.weekly !== false ? "checked" : ""} ${push.busy ? "disabled" : ""}> Sunday evening: summary of the week</label>
        <p class="small muted">During reps you'll also get a "time's up" alert, even if the phone is locked.</p>
        <div class="row"><button class="btn sm quiet" data-act="push-test" ${push.busy ? "disabled" : ""}>Send a test</button><button class="btn sm ghost" data-act="push-off" ${push.busy ? "disabled" : ""}>Turn off on this phone</button></div>`;
    } else {
      inner = `<button class="btn" data-act="push-on" ${push.busy ? "disabled" : ""}>Turn on reminders on this phone</button>`;
    }
    return `<div class="card">
      <div><h2>Reminders</h2><p class="small muted">Each of you turns this on on your own phone. Morning comes around 7–8, the evening nudge around 6–7.</p></div>
      ${inner}
      ${push.error ? `<p class="small" style="color:var(--upset)">${esc(push.error)}</p>` : ""}
    </div>`;
  }

  // ---------- timer ----------
  const overlay = document.getElementById("overlay");
  let audio = null, wakeLock = null;
  function beep() {
    if (!audio) return;
    try {
      [0, 0.35].forEach(off => {
        const o = audio.createOscillator(), g = audio.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
        g.gain.setValueAtTime(0.0001, audio.currentTime + off);
        g.gain.exponentialRampToValueAtTime(0.3, audio.currentTime + off + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + off + 0.25);
        o.start(audio.currentTime + off); o.stop(audio.currentTime + off + 0.3);
      });
    } catch (e) {}
  }

  // A "time's up" push scheduled on the server, so it arrives even if the phone is locked or in another app.
  async function repAlertsOn(tm) {
    if (!push.sub || !push.prefs) return;
    try {
      const r = await api("/api/rep-alert", { method: "POST", body: JSON.stringify({ endpoint: push.sub.endpoint, endsAt: tm.start + tm.target * 1000, title: `Time's up · rep ${tm.i + 1}`, body: `Go back in to ${dog()}, then log how it went.` }) });
      if (!r.messageId) return;
      if (state.timer === tm && !tm.alertsOff) tm.alertId = r.messageId;
      else api("/api/rep-alert", { method: "DELETE", body: JSON.stringify({ messageId: r.messageId }) }).catch(() => {}); // rep already over
    } catch (e) { console.error(e); }
  }
  function repAlertsOff(tm) {
    if (!tm || tm.alertsOff) return;
    tm.alertsOff = true;
    if (tm.alertId) api("/api/rep-alert", { method: "DELETE", body: JSON.stringify({ messageId: tm.alertId }) }).catch(() => {});
    if (push.reg && push.reg.getNotifications) push.reg.getNotifications({ tag: "rep" }).then(ns => ns.forEach(n => n.close())).catch(() => {});
  }

  // Ask the phone to keep the screen on during a rep (the timer can't beep from a locked phone).
  // The lock drops when the app is hidden, so ask again when it comes back.
  function keepAwake() {
    try { if (navigator.wakeLock && !wakeLock) navigator.wakeLock.request("screen").then(l => { wakeLock = l; l.addEventListener("release", () => (wakeLock = null)); }).catch(() => {}); } catch (e) {}
  }
  document.addEventListener("visibilitychange", () => { if (state.timer && document.visibilityState === "visible") { keepAwake(); drawTimer(); } });

  function startRep(i) {
    const s = ensureToday();
    const target = s.plan[i];
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume && audio.resume(); } catch (e) {}
    keepAwake();
    const door = sessionMode(s) === "door";
    state.timer = { i, target, start: Date.now(), done: false, actual: null, result: null, phase: door ? "leaving" : "run", door };
    overlay.hidden = false;
    drawTimer();
    state.timer.tick = setInterval(drawTimer, 250);
    if (!door) repAlertsOn(state.timer);
  }

  function drawTimer() {
    const tm = state.timer; if (!tm) return;
    if (tm.phase === "outcome") return;
    if (tm.phase === "leaving") {
      if (!overlay.querySelector("#t-out")) {
        overlay.innerHTML = `
          <div><p class="eyebrow">Rep ${tm.i + 1} · ${fmt(tm.target)}</p><h2 style="margin-top:6px">Head out through both doors</h2></div>
          <p class="small" style="color:#b4aaa0;max-width:28rem">Tap "I'm out" once both doors are shut behind you. The timer starts then.</p>
          <div class="row" style="justify-content:center"><button class="btn" id="t-out">I'm out</button><button class="btn quiet" id="t-cancel">Cancel rep</button></div>`;
        overlay.querySelector("#t-out").onclick = () => { tm.phase = "run"; tm.start = Date.now(); overlay.innerHTML = ""; drawTimer(); repAlertsOn(tm); };
        overlay.querySelector("#t-cancel").onclick = closeTimer;
      }
      return;
    }
    const elapsed = (Date.now() - tm.start) / 1000;
    const left = tm.target - elapsed;
    if (left <= 0 && !tm.done) { tm.done = true; beep(); try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) {} return finishTimer(tm.target); }
    const C = 2 * Math.PI * 46, frac = Math.min(1, elapsed / tm.target);
    if (!overlay.querySelector(".ring")) {
      overlay.innerHTML = `
        <div><p class="eyebrow">Rep ${tm.i + 1} · ${fmt(tm.target)}</p><h2 style="margin-top:6px">${tm.door ? "You're out. Stay out" : "Close the gate and go out of sight"}</h2></div>
        <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="#36302c" stroke-width="6"/><circle id="ring-fg" cx="50" cy="50" r="46" fill="none" stroke="#e39a57" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg>
          <div class="clock"><b id="t-left" class="num">${clock(left)}</b><span class="small" style="color:#b4aaa0">left</span></div></div>
        <p class="small" style="color:#b4aaa0;max-width:28rem">Come back in when it beeps. If ${esc(dog())} starts to stress, come back right away and end the rep. Keep this screen open: a locked phone can't beep.</p>
        <div class="row" style="justify-content:center"><button class="btn" id="t-early">I came back early</button><button class="btn quiet" id="t-cancel">Cancel rep</button></div>`;
      overlay.querySelector("#t-early").onclick = () => finishTimer(Math.round((Date.now() - tm.start) / 1000));
      overlay.querySelector("#t-cancel").onclick = closeTimer;
    }
    overlay.querySelector("#t-left").textContent = clock(left);
    overlay.querySelector("#ring-fg").setAttribute("stroke-dashoffset", (C * frac).toFixed(2));
  }

  function finishTimer(actual) {
    const tm = state.timer;
    clearInterval(tm.tick);
    repAlertsOff(tm);
    tm.phase = "outcome"; tm.actual = Math.max(1, Math.min(actual, tm.target));
    const early = tm.actual < tm.target;
    overlay.innerHTML = `
      <div><p class="eyebrow">Rep ${tm.i + 1} · ${early ? `${fmt(tm.actual)} of ${fmt(tm.target)}` : fmt(tm.target)}</p><h2 style="margin-top:6px">${early ? "How was " + esc(dog()) + "?" : "Time's up. How was " + esc(dog()) + "?"}</h2></div>
      <div class="outcome">
        ${Object.entries(RESULTS).map(([k, v]) => `<button class="res ${k}" data-res="${k}" aria-pressed="${!early && k === "calm"}"><b>${v.label}</b><span>${v.hint}</span></button>`).join("")}
        <input type="text" id="t-note" placeholder="Note (optional)" autocomplete="off">
        <div class="row"><button class="btn" id="t-save">Save rep</button><button class="btn quiet" id="t-skip">Didn't do it</button></div>
      </div>`;
    tm.result = early ? null : "calm";
    overlay.querySelectorAll(".res").forEach(b => (b.onclick = () => { tm.result = b.dataset.res; overlay.querySelectorAll(".res").forEach(x => x.setAttribute("aria-pressed", x === b)); }));
    overlay.querySelector("#t-save").onclick = () => { if (!tm.result) return toast("Pick how it went first."); recordRep(tm.result, overlay.querySelector("#t-note").value.trim()); };
    overlay.querySelector("#t-skip").onclick = () => recordRep("skip", "");
  }

  function recordRep(result, note) {
    const tm = state.timer, t = todayStr();
    const s = state.sessions.get(t) || ensureToday();
    if (result === "upset") state.ignoreUpset = false;
    saveReps(t, [{ i: tm.i, target: tm.target, actual: result === "skip" ? 0 : tm.actual, result, note, by: state.me, startedAt: tm.start, at: Date.now() }]);
    closeTimer();
  }

  function closeTimer() {
    if (state.timer) { clearInterval(state.timer.tick); repAlertsOff(state.timer); }
    state.timer = null; overlay.hidden = true; overlay.innerHTML = "";
    try { wakeLock && wakeLock.release(); } catch (e) {}
    wakeLock = null;
    render();
  }

  // ---------- editing a logged rep, logging a real absence ----------
  function sheet(html) { overlay.hidden = false; overlay.innerHTML = html; }
  function closeSheet() { overlay.hidden = true; overlay.innerHTML = ""; render(); }
  function resultButtons(selected, extra = {}) {
    return Object.entries({ ...RESULTS, ...extra }).map(([k, v]) => `<button type="button" class="res ${k}" data-res="${k}" aria-pressed="${k === selected}"><b>${v.label}</b><span>${v.hint}</span></button>`).join("");
  }
  function wireResults(onPick) {
    overlay.querySelectorAll(".res").forEach(b => (b.onclick = () => { onPick(b.dataset.res); overlay.querySelectorAll(".res").forEach(x => x.setAttribute("aria-pressed", x === b)); }));
  }

  function editRep(date, i) {
    const s = state.sessions.get(date); const r = s && (s.reps || []).find(x => x.i === i); if (!r) return;
    let result = r.result === "skip" ? null : r.result;
    sheet(`
      <div><p class="eyebrow">${esc(niceDate(date, { weekday: "short", day: "numeric", month: "short" }))} · rep ${i + 1} · planned ${fmt(r.target)}</p><h2 style="margin-top:6px">Change this rep</h2></div>
      <div class="outcome">
        ${resultButtons(result)}
        <input type="text" id="e-actual" value="${r.result === "skip" ? "" : fmt(r.actual || r.target)}" placeholder="How long it lasted, e.g. 1m 30s" autocomplete="off">
        <input type="text" id="e-note" value="${esc(r.note || "")}" placeholder="Note (optional)" autocomplete="off">
        <div class="row"><button class="btn" id="e-save">Save changes</button><button class="btn quiet" id="e-delete">Delete rep</button><button class="btn quiet" id="e-cancel">Cancel</button></div>
      </div>`);
    wireResults(v => (result = v));
    overlay.querySelector("#e-cancel").onclick = closeSheet;
    overlay.querySelector("#e-delete").onclick = () => { deleteRep(date, i); closeSheet(); toast(`Rep ${i + 1} deleted. You can do it again.`); };
    overlay.querySelector("#e-save").onclick = () => {
      if (!result) return toast("Pick how it went first.");
      const actual = parseDur(overlay.querySelector("#e-actual").value) || r.target;
      saveReps(date, [{ ...r, result, actual: Math.min(actual, r.target), note: overlay.querySelector("#e-note").value.trim(), editedBy: state.me, editedAt: Date.now() }]);
      closeSheet(); toast("Rep updated.");
    };
  }

  function absenceSheet(existing) {
    const a = existing || null;
    const now = new Date();
    const startDefault = a ? new Date(a.start) : new Date(now.getTime() - 60 * 60 * 1000);
    const day = d => (dateStr(d) === todayStr() ? "today" : dateStr(d) === dateStr(new Date(now.getTime() - 864e5)) ? "yesterday" : "other");
    let result = a ? a.result : null;
    sheet(`
      <div><p class="eyebrow">Real absence</p><h2 style="margin-top:6px">${a ? "Change time alone" : `When was ${esc(dog())} left alone?`}</h2></div>
      <div class="outcome">
        <p class="small" style="color:#b4aaa0">For times you had to leave ${esc(dog())} alone outside training: work, errands, appointments.</p>
        <div class="row">
          <select id="a-day" style="flex:1"><option value="today" ${day(startDefault) === "today" ? "selected" : ""}>Today</option><option value="yesterday" ${day(startDefault) === "yesterday" ? "selected" : ""}>Yesterday</option>${day(startDefault) === "other" ? `<option value="${dateStr(startDefault)}" selected>${esc(niceDate(dateStr(startDefault), { day: "numeric", month: "short" }))}</option>` : ""}</select>
          <input type="time" id="a-time" value="${pad(startDefault.getHours())}:${pad(startDefault.getMinutes())}" style="flex:1">
        </div>
        <input type="text" id="a-dur" value="${a ? fmt(a.seconds) : ""}" placeholder="How long, e.g. 2h or 45m" autocomplete="off">
        ${resultButtons(result, { unknown: { label: "Don't know", hint: "No camera, or didn't watch" } })}
        <input type="text" id="a-note" value="${esc(a ? a.note : "")}" placeholder="Note (optional)" autocomplete="off">
        <div class="row"><button class="btn" id="a-save">Save</button>${a ? `<button class="btn quiet" id="a-delete">Delete</button>` : ""}<button class="btn quiet" id="a-cancel">Cancel</button></div>
      </div>`);
    wireResults(v => (result = v));
    overlay.querySelector("#a-cancel").onclick = closeSheet;
    if (a) overlay.querySelector("#a-delete").onclick = () => { deleteAbsence(a.id); closeSheet(); toast("Deleted."); };
    overlay.querySelector("#a-save").onclick = () => {
      const seconds = parseDur(overlay.querySelector("#a-dur").value);
      if (!seconds) return toast("Type how long, like 2h or 45m.");
      if (!result) return toast("Pick how it went, or Don't know.");
      const dayVal = overlay.querySelector("#a-day").value;
      const date = dayVal === "today" ? todayStr() : dayVal === "yesterday" ? dateStr(new Date(now.getTime() - 864e5)) : dayVal;
      const [hh, mm] = (overlay.querySelector("#a-time").value || "12:00").split(":").map(Number);
      const start = new Date(+date.slice(0, 4), +date.slice(5, 7) - 1, +date.slice(8, 10), hh, mm).getTime();
      saveAbsence({ id: a ? a.id : newId(), date, start, seconds, result, note: overlay.querySelector("#a-note").value.trim(), by: a ? a.by : state.me });
      closeSheet(); toast("Saved.");
    };
  }

  // ---------- events ----------
  document.getElementById("tabs").addEventListener("click", e => {
    const b = e.target.closest("button[data-tab]"); if (!b) return;
    state.tab = b.dataset.tab; render(); window.scrollTo(0, 0);
    try { localStorage.setItem("yeti-tab", state.tab === "report" ? "history" : state.tab); } catch (err) {}
  });

  appEl.addEventListener("click", e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const act = b.dataset.act, t = todayStr();
    if (act === "start") startRep(+b.dataset.i);
    else if (act === "edit-rep") editRep(b.dataset.d, +b.dataset.i);
    else if (act === "open-report") { state.tab = "report"; render(); window.scrollTo(0, 0); }
    else if (act === "back-history") { state.tab = "history"; render(); window.scrollTo(0, 0); }
    else if (act === "report-period") { state.report = { ...(state.report || {}), period: b.dataset.p }; render(); }
    else if (act === "report-pdf") exportReport("pdf");
    else if (act === "report-png") exportReport("png");
    else if (act === "log-absence") absenceSheet(null);
    else if (act === "edit-absence") absenceSheet(state.absences.find(a => a.id === b.dataset.id));
    else if (act === "logout") { api("/api/logout", { method: "POST" }).catch(() => {}).finally(() => { state.me = null; state.configLoaded = false; lastSnapshot = ""; render(); }); }
    else if (act === "toggle-hint") {
      state.hints[b.dataset.k] = !state.hints[b.dataset.k];
      try { localStorage.setItem("yeti-hints", JSON.stringify(state.hints)); } catch (e) {}
      render();
    }
    else if (act === "push-on") turnOnPush();
    else if (act === "push-off") turnOffPush();
    else if (act === "push-test") testPush();
    else if (act === "goto-settings") { state.tab = "settings"; render(); window.scrollTo(0, 0); }
    else if (act === "pick-stage") { state.stagePick = b.dataset.mode; render(); }
    else if (act === "switch-stage") {
      const mode = state.stagePick || curMode();
      const typed = document.getElementById("stage-base").value.trim();
      const v = typed ? parseDur(typed) : null;
      if (typed && !v) return toast("Type a time like 2m, 90s or 1:30, or leave it empty.");
      const seconds = v || (getBase(mode) ? null : STAGES[mode].defaultStart);
      const now = setStage(mode, seconds);
      state.stagePick = null;
      toast(now ? `Switched to ${STAGES[mode].label.toLowerCase()}. Today's plan is updated.` : `Switched to ${STAGES[mode].label.toLowerCase()}. It starts with tomorrow's session, since reps are already done today.`);
    }
    else if (act === "train-anyway") { state.trainAnyway = true; render(); }
    else if (act === "ignore-upset") { state.ignoreUpset = true; render(); }
    else if (act === "end-session") {
      const s = state.sessions.get(t); if (!s) return;
      const skips = s.plan.map((target, i) => ({ i, target, actual: 0, result: "skip", note: "", by: state.me, at: Date.now() })).filter(r => !(s.reps || []).find(x => x.i === r.i));
      if (skips.length) saveReps(t, skips);
    } else if (act === "add-rep") {
      const v = parseDur(document.getElementById("extra-dur").value);
      if (!v) return toast("Type a time first, like 45s or 2m.");
      const s = ensureToday();
      saveSession(t, { plan: s.plan.concat([v]) });
    } else if (act === "toggle-hist") {
      const d = b.dataset.d; state.openHistory.has(d) ? state.openHistory.delete(d) : state.openHistory.add(d); render();
    } else if (act === "save-settings") {
      const cap = Math.min(120, Math.max(5, +document.getElementById("set-cap").value || 30));
      saveConfig({ dogName: document.getElementById("set-name").value.trim() || "Yeti", perWeek: +document.getElementById("set-per").value, capMin: cap });
      toast("Settings saved.");
    } else if (act === "set-base") {
      const v = parseDur(document.getElementById("set-base").value);
      if (!v) return toast("Type a time like 2m, 90s or 1:30.");
      setStage(curMode(), v);
      toast(`Level set to ${fmt(v)}.`);
    }
  });

  appEl.addEventListener("change", e => {
    if (e.target.id === "rp-from" || e.target.id === "rp-to") {
      state.report = { ...state.report, period: "custom", from: document.getElementById("rp-from").value, to: document.getElementById("rp-to").value };
      render(); return;
    }
    if (["push-morning", "push-evening", "push-weekly"].includes(e.target.id)) {
      savePushPrefs({ morning: document.getElementById("push-morning").checked, evening: document.getElementById("push-evening").checked, weekly: document.getElementById("push-weekly").checked });
      return;
    }
    if (e.target.id === "cues-done") { ensureToday(); saveSession(todayStr(), { cuesDone: e.target.checked }); }
  });
  appEl.addEventListener("focusout", e => {
    if (e.target.id === "notes") {
      const t = todayStr(), s = state.sessions.get(t), v = e.target.value;
      if (s && s.notes !== v) setTimeout(() => saveSession(t, { notes: v }));
      else setTimeout(render);
    }
  });

  // ---------- boot ----------
  try { const tab = localStorage.getItem("yeti-tab"); if (tab) state.tab = tab; } catch (e) {}
  if (location.hash === "#history") { state.tab = "history"; history.replaceState(null, "", "/"); }

  (async () => {
    try {
      const r = await fetch("/api/me", { credentials: "same-origin" });
      if (r.ok) state.me = (await r.json()).name;
      else if (r.status !== 401) {
        const body = await r.json().catch(() => ({}));
        appEl.innerHTML = `<div class="card empty">${esc(body.error || "The server isn't working right now. Try again in a minute.")}</div>`;
        return;
      }
    } catch (e) {
      appEl.innerHTML = `<div class="card empty">Can't reach the server. Check your connection and reload.</div>`;
      return;
    }
    state.authChecked = true;
    render();
    if (state.me) { load(); initPush(); }
  })();
  const refresh = () => { if (state.me && document.visibilityState === "visible") load(); };
  setInterval(refresh, 15000);
  document.addEventListener("visibilitychange", refresh);
})();
</script>
</body>
</html>
